# Build and deploy the site to GitHub Pages.
# The site is the repository as it is, plus the leo-catalog TLE snapshot that
# tle-snapshot.sh writes. The schedule refreshes the snapshot every 2 h, so
# visitors load the TLE data from this site and not from CelesTrak.
# Requires Settings > Pages > Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write leo-catalog TLE snapshot
        run: bash stella-nova/pages/leo-catalog/tools/tle-snapshot.sh
      # Storm Globe: NHC/JTWC storms, EONET events and GFS winds. NHC sends
      # no CORS header, so the page cannot read it itself. A failure keeps
      # the committed sample (the step writes nothing when it fails).
      - name: Write storm-globe snapshot
        run: node stella-nova/pages/storm-globe/tools/snapshot.mjs
        continue-on-error: true
      # Market Forecast: IEX HIST real trades (T+1, IEX cited). The browser
      # cannot read IEX files, so this step builds data/live/iex.json. It
      # reads only sessions the deployed snapshot does not have yet. A
      # failure keeps the committed sample (the step writes nothing).
      - name: Write market-forecast IEX snapshot
        run: node stella-nova/pages/market-forecast/tools/snapshot.mjs --max-days 1 --budget-min 25 --streams 6
        timeout-minutes: 30
        continue-on-error: true
      # The Craft Suite pages host upstream web builds that are not in git.
      # Download the pinned release zips and check each sha256.
      - name: Fetch pinned Craft builds
        run: node tools/craft-fetch.mjs && node tools/craft-fetch.mjs --check
      # Retro Shelf: the pinned engines (js-dos emulators, EmulatorJS and its
      # cores) and the freeware game archives. They are not in git. Each file
      # is sha256 checked. A failure (a mirror is down) does not stop the
      # deploy: the page then says that the file is not available.
      - name: Fetch pinned Retro Shelf files
        run: node tools/retro-fetch.mjs && node tools/retro-fetch.mjs --check
        continue-on-error: true
      # Stem Splitter: the official Demucs checkpoints (84 MB + 55 MB) are
      # not in git. The cache keeps them between runs, so the scheduled
      # deploys do not download them from Meta each time. Each file is
      # sha256 checked. A failure does not stop the deploy: the page then
      # says that the model is not available.
      - name: Restore Stem Splitter weights
        uses: actions/cache@v4
        with:
          path: stella-nova/pages/stem-splitter/models/*.th
          key: stem-weights-8726e21a-34c22ccb
      - name: Fetch pinned Stem Splitter weights
        run: node tools/stem-splitter/fetch.mjs && node tools/stem-splitter/fetch.mjs --check
        continue-on-error: true
      # The service worker file list and version stamp (sw-manifest.js, sw.js).
      # Run here too, so the deploy never ships a list that is out of date.
      - name: Write offline manifest
        run: node tools/offline-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

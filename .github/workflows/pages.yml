# Build and deploy the site to GitHub Pages.
# The site is the repository as it is, plus the leo-catalog TLE snapshot that
# tle-snapshot.sh writes. The schedule refreshes the snapshot every 2 h, so
# visitors load the TLE data from this site and not from CelesTrak.
# Requires Settings > Pages > Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write leo-catalog TLE snapshot
        run: bash stella-nova/pages/leo-catalog/tools/tle-snapshot.sh
      # Storm Globe: NHC/JTWC storms, EONET events and GFS winds. NHC sends
      # no CORS header, so the page cannot read it itself. A failure keeps
      # the committed sample (the step writes nothing when it fails).
      - name: Write storm-globe snapshot
        run: node stella-nova/pages/storm-globe/tools/snapshot.mjs
        continue-on-error: true
      # The Craft Suite pages host upstream web builds that are not in git.
      # Download the pinned release zips and check each sha256.
      - name: Fetch pinned Craft builds
        run: node tools/craft-fetch.mjs && node tools/craft-fetch.mjs --check
      # The service worker file list and version stamp (sw-manifest.js, sw.js).
      # Run here too, so the deploy never ships a list that is out of date.
      - name: Write offline manifest
        run: node tools/offline-manifest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

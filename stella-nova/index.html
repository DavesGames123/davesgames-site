<style>
:root{--bg:#0a0c12;--bg2:#0d1018;--sidebar:#0b0e15;--border:rgba(150,200,255,0.09);--border-b:rgba(150,200,255,0.18);--ink:#eef3fb;--dim:#7f91ad;--f-sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;--f-serif:'Instrument Serif','Iowan Old Style',Georgia,serif;--ease:cubic-bezier(.2,.7,.2,1);--blue:#96c8ff;--blue-dim:#4a7aaa;--yellow:#ffc832;--orange:#ff7b00;--green:#64c864;--red:#ff5050;--text:#c0cfe0;--text-dim:#5a7090;--text-faint:#2a3850;--sidebar-w:290px;--topbar-h:56px}

<script>try{if(localStorage.getItem('sn-sb-collapsed')==='1')document.body.classList.add('sb-collapsed')}catch(e){}</script>

<div id="shell">
  <nav id="sidebar">
    <div id="sb-header">
      <a id="sb-wordmark" href="#home" aria-label="Stella Nova, go to the homepage" onclick="if(!(event.metaKey||event.ctrlKey||event.shiftKey||event.button)){event.preventDefault();switchTab('home')}"><span>Stella</span><span>Nova</span></a>

      <button id="collapse-btn" onclick="toggleSidebar()" title="Collapse / expand index">&#171;</button>

    </div>

<script src="lib/nav-data.js"></script>
<script>
/* ── nav ──────────────────────────────────────────────────────────────
   lib/nav-data.js is the one page registry. buildNav writes the sidebar
   from it: a heading per region, a collapsible cluster per constellation,
   a sub-heading per named group. A constellation with one page and no
   heading is one row (.solo). PAGES and LABELS come from the same data.
   grep -n targets: "function buildNav", "function openClusterOf" */
var PAGES={},LABELS={};
snPages().forEach(function(p){PAGES[p.key]=p.path;LABELS[p.key]=p.label});
function navEsc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function navRow(p){return '<button class="nav-item" data-tab="'+p[0]+'" onclick="switchTab(\''+p[0]+'\')"><span class="nav-label">'+navEsc(p[1])+'</span>'+(p[2]?'<span class="nav-badge">'+navEsc(p[2])+'</span>':'')+'</button>'}
function buildNav(){var h='';SN_NAV.forEach(function(r){h+='<div class="nav-region">'+navEsc(r.label)+'</div>';r.constellations.forEach(function(c){var st=' style="--c:'+c.color+'"';var icon='<span class="cluster-icon">'+c.icon+'</span><span class="cluster-label">'+navEsc(c.label)+'</span><span class="cluster-arrow">&#8250;</span>';var g0=c.groups[0];if(c.groups.length===1&&!g0.h&&g0.p.length===1){var k=g0.p[0][0];h+='<div class="cluster" id="cl-'+c.id+'"'+st+'><button class="cluster-head solo" data-tab="'+k+'" onclick="switchTab(\''+k+'\')">'+icon+'</button></div>';return}h+='<div class="cluster" id="cl-'+c.id+'"'+st+'><button class="cluster-head" onclick="toggleCluster(\'cl-'+c.id+'\')">'+icon+'</button><div class="cluster-body">';c.groups.forEach(function(g){if(g.h)h+='<div class="nav-sub"'+(g.id?' id="'+g.id+'"':'')+'>'+navEsc(g.h)+'</div>';g.p.forEach(function(p){h+=navRow(p)})});h+='</div></div>'})});document.getElementById('sb-nav').innerHTML=h}
buildNav();
// Open the cluster that holds the active page, so a deep link shows where
// the page sits. Other clusters keep their state.
function openClusterOf(id){var el=document.querySelector('#sb-nav .nav-item[data-tab="'+id+'"]');var cl=el&&el.closest('.cluster');if(cl)cl.classList.add('open')}
const XR_PAGES=new Set(['orbital']);
const MIC_PAGES=new Set(['chordlab']);
let activeTab=null;
// PAGE SWAP. Each page runs in one iframe and can hold a WebGPU device or a
// WebGL context. A fast series of clicks used to stack many live GPU pages,
// because removing an iframe leaves its GPU memory to the garbage collector.
// Safari then ran out of GPU memory and the tab did not recover.
// The swap now does three things:
//   releaseFrame  calls the page's lib/gpu-guard.js __snRelease (destroy
//                 every device, lose every WebGL context, stop rAF), then
//                 releases each canvas directly as a fallback
//   doSwap        loads about:blank into the old iframe so the document
//                 unloads now, then removes the iframe and mounts the new page
//   pendingTab    clicks during a swap only change the target tab, so a
//                 click series mounts one page, not one page per click
var pendingTab=null,swapBusy=false,SWAP_SETTLE_MS=250,SWAP_UNLOAD_MS=300;
function releaseFrame(f){try{var w=f.contentWindow;if(w&&w.__snRelease)w.__snRelease()}catch(e){}try{var d=f.contentDocument;if(!d)return;d.querySelectorAll('canvas').forEach(function(c){try{var g=c.getContext('webgpu');if(g){try{var cfg=g.getConfiguration&&g.getConfiguration();if(cfg&&cfg.device){cfg.device.destroy();return}}catch(e){}try{g.unconfigure()}catch(e){}return}var gl=c.getContext('webgl2')||c.getContext('webgl');if(gl){var x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}}catch(e){}})}catch(e){}}
/* ── history ──────────────────────────────────────────────────────────
   The shell owns the browser history. The URL is #<tab> or #<tab>/<route>,
   where <route> is the page's own hash without '#', for example
   #wiki/e/resources/iron-ingot. Rules:
     - A tab switch from the UI pushes one entry (switchTab mode 'push').
     - Back and Forward (popstate, hashchange) route with mode 'none'. When
       only <route> changes on the same tab, the page gets the new hash by
       location.replace, so no page reload and no extra entry.
     - A page that calls window.snNav(route) pushes one entry for an inner
       route change (the wiki does this); snNav(route, 'replace') rewrites
       the URL only, for a cancelled change. Such a page must not push its own
       entries while it is in the shell.

  ═══════════════════════════════════════════════════════════════════════════
   BEAD ON A WIRE  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Beads on a wire by position based dynamics next to the analytic solution, with other wire shapes, several beads and force arrows. The page starts a random scene on load and keeps it running.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #05.
   Upstream file: tenMinutePhysics/05-bead.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js, which holds the upstream step).
   Video tutorial: https://youtu.be/qISgdDhdCro

   OUR ADDITIONS (davesgames.io, not upstream): wire shapes with a closest-point projection, several beads, start speeds, friction, force arrows, dragging, the renderer, the sim kit GUI and the saver.

   FILES
     sim.js      simulation, schema, guard (no DOM)
     main.js     page controller: sim kit GUI, drawing, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, page2d frame),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  sim.js     controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

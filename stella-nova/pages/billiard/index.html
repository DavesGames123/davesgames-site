  ═══════════════════════════════════════════════════════════════════════════
   BILLIARD  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Balls that collide with restitution: the upstream box, a pool break with pockets, a gas against the Maxwell-Boltzmann speeds, two gases mixing and Brownian motion. The page starts a random scene on load and keeps it running.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #03.
   Upstream file: tenMinutePhysics/03-billiard.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js, which holds the upstream step).
   Video tutorial: https://youtu.be/ThhdlMbGT5g

   OUR ADDITIONS (davesgames.io, not upstream): layouts, a pool table with pockets, a round table, bumpers, rolling friction, gravity, a spatial grid, the cue shot, a speed histogram, the renderer, the sim kit GUI and the saver.

   FILES
     sim.js      simulation, schema, guard (no DOM)
     main.js     page controller: sim kit GUI, drawing, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, page2d frame),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  sim.js     controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

<!--
  ═══════════════════════════════════════════════════════════════════════════
   CANNONBALL 2D  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Balls fired from a cannon under gravity, bouncing off the walls, pegs
   and each other. The page starts a random scene on load and keeps it
   running.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #01.
   Upstream file: tenMinutePhysics/01-cannonball2d.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js, which holds the upstream Euler step).
   Video tutorial: https://youtu.be/oPuSvdBGrpE

   OUR ADDITIONS (davesgames.io, not upstream): cannons, pegs, many balls,
   collisions, the renderer, the sim kit GUI and the saver.

   FILES
     sim.js      simulation, schema, guard (no DOM)
     main.js     page controller: sim kit GUI, drawing, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, page2d frame),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  sim.js     controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

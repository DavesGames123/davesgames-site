<!--
  ═══════════════════════════════════════════════════════════════════════════
   CANNONBALL 3D  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Balls under gravity in a box, in three.js. The page starts a random
   scene on load and keeps it running. Drag a ball to throw it.

   CREDIT. The upstream demo is Ten Minute Physics #02 by Matthias Müller:
   tenMinutePhysics/02-cannonball3d.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js). Video: https://youtu.be/j84zJ06wnVA. The
   credit bar (kit.js) names the author on the page and the saver plate.

   OUR ADDITIONS (davesgames.io, not upstream): many balls, ball-ball
   impulses, friction, drag, wind, tilt, bumpers, crates, the cannon,
   the throw pointer, the look, the GUI and the saver.

   FILES
     sim.js      ball physics (the upstream step plus our additions)
     scene.js    schema, random rules, guard (no DOM)
     app.js      page controller (cannonball-vr runs it too)
     saver.js    screensaver shots (sim kit director)
     main.js     credit record + start()
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, 3D stage),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scene.js   controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

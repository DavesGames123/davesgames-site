  ═══════════════════════════════════════════════════════════════════════════
   CANNONBALL VR  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   The cannonball box for a VR headset: the cannonball-3d app with
   renderer.xr on and the three.js VRButton (Enter VR). On a desktop the
   page is the same sim with the sim kit GUI.

   CREDIT. The upstream demo is Ten Minute Physics #02 by Matthias Müller:
   tenMinutePhysics/02-cannonballVR.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of ../cannonball-3d/sim.js). Video: https://youtu.be/j84zJ06wnVA. The
   credit bar (kit.js) names the author on the page and the saver plate.

   OUR ADDITIONS (davesgames.io, not upstream): many balls, ball-ball
   impulses, friction, drag, wind, tilt, bumpers, crates, the cannon,
   the throw pointer, the look, the GUI and the saver.

   FILES
     main.js      credit record + start({ vr: true })
     vrbutton.js  the three.js VRButton (MIT), as the upstream page copied it
     (style)      ../cannonball-3d/style.css (it holds .vr-slot)
     tests.mjs    node tests (no browser)
   The app is ../cannonball-3d/ (sim.js, scene.js, app.js, saver.js).
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, 3D stage),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  ../cannonball-3d/scene.js
     grep -n 'const SHOTS'                 ../cannonball-3d/saver.js
  ═══════════════════════════════════════════════════════════════════════════
-->

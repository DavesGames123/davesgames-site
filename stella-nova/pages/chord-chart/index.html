<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chord Chart // Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   CHORD CHART  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. main.js fills the empty containers with the root
   chips, the chord cards and the detail panel. Each chord diagram is an SVG
   string from diagrams.js.

   LOAD ORDER  (classic scripts, so the page also runs on file://)
     1. in-frame guard   adds .in-frame when the site shell embeds the page
     2. mobile-switch.js sets the .mob phone-layout flag early
     3. style.css        page stylesheet
     4. theory.js        chord theory, spelling, parser, voicings (no DOM)
     5. diagrams.js      chord diagrams as SVG strings (no DOM)
     6. main.js          builds the UI, the detail panel and the strum synth

   LAYOUT  (# marks an element id that main.js writes into)
     ┌───────────────────────────────────────────────┬───────────────────┐
     │ #rootStrip   C D♭ D E♭ E F F♯ G A♭ A B♭ B      │                   │
     │ #bigRoot  #instSeg  #qualSeg  #find            │  #detail          │
     │ #tuning                                        │  (side panel;     │
     │ #gridLbl                                       │   a bottom sheet  │
     │ #grid   one card per chord quality             │   on phones)      │
     └───────────────────────────────────────────────┴───────────────────┘
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>
<script src="mobile-switch.js"></script>

<div class="topbar">
  <div class="topbar-l"><span class="sys-name">Stella Nova</span><span class="sys-status">Chord Chart</span></div>
  <div class="topbar-r">chord reference</div>
</div>

<div id="app">
  <main id="chart">
    <!-- Root picker: main.js adds the twelve pitch-class chips. -->
    <nav id="rootStrip" aria-label="Root note"></nav>

    <div id="toolbar">
      <div id="bigRoot" aria-live="polite">C</div>
      <!-- data-i is the instrument key main.js reads. -->
      <div class="seg" id="instSeg" role="group" aria-label="Instrument">
        <button data-i="guitar" class="on">Guitar</button>
        <button data-i="bass">Bass</button>
        <button data-i="ukulele">Uke</button>
        <button data-i="violin">Violin</button>
      </div>
      <!-- data-f is a key of ChordTheory.QUAL_GROUPS. -->
      <div class="seg" id="qualSeg" role="group" aria-label="Chord qualities">
        <button data-f="all" class="on">All</button>
        <button data-f="triads">Triads</button>
        <button data-f="sevenths">7ths</button>
      </div>
      <form id="find" role="search" autocomplete="off">
        <input id="findIn" type="search" placeholder="Find a chord: F#m7, Bbmaj7" aria-label="Find a chord by name" spellcheck="false" enterkeyhint="go">
        <span id="findMsg" aria-live="polite"></span>
      </form>
    </div>
    <div id="tuning"></div>

    <div id="chartBody">
      <h2 class="gsec-lbl"><span id="gridLbl"></span><span class="gs-note">major, minor and 7 first · tap a card for every voicing</span></h2>
      <div class="grid" id="grid"></div>
      <p id="keys">← → root · / find · Enter open · Esc close · Space play</p>
    </div>
  </main>

  <!-- Detail of the selected chord: notes, intervals, every voicing. -->
  <aside id="detail" aria-label="Chord detail" hidden>
    <div class="grip" aria-hidden="true"></div>
    <button id="dClose" class="icon-b" aria-label="Close the chord detail">×</button>
    <div id="dBody"></div>
  </aside>
</div>

<script src="theory.js"></script>
<script src="diagrams.js"></script>
<script src="main.js"></script>
</body>
</html>

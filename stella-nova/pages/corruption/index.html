<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Corruption Shader — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   CORRUPTION SHADER  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A system-corruption material that goes on any geometry: a charred voxel
   crust spreads from an origin, a red front burns ahead of it, cracks run
   into the clean surface, polyhedra shed off the infected parts and red
   zeros and ones drift round them. The same WGSL material shades SDF
   models (ray marched) and triangle meshes (rasterised), so the stage can
   switch between both kinds, or take a .glb file. Shuffle draws a new set
   of all the parameters from a seed.

   FILES
     params.js    parameter rows, seeded shuffle, uniform layout and packing
     models.js    stage models, mesh builders, surface sampler, polyhedra
     camera.js    orbit camera, matrices, the pixel ray
     gpu.js       the WebGPU renderer (no DOM; Deno renders it offscreen)
     shaders/corruption.wgsl  the material, SDF scene, particles, post
                  (gpu.js adds the library of ../sdf-solids-table/shaders/pack.wgsl)
     saver.js     the screensaver shot plan and window.snSaver
     main.js      DOM: panel, stage bar, dock, input, pick, loop, governor
     tests.mjs    node checks; tools/render-check.mjs Deno offscreen frames

   LAYOUT  (# marks an element id main.js binds)
     #view ....... the WebGPU canvas, full window
     #nogpu ...... the message when WebGPU is missing
     #stageBar ... desktop: #modelChips, #btnShuffle, #seedLbl
     #hint ....... the pointer hint
     #panel ...... lib/sn-panel.js sections, made by main.js buildUI
     #dock ....... phone: #dkPanel #dkPrev #dkModel #dkNext #dkShuffle
     #glbFile .... the hidden file input; #drop the drag-and-drop veil
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="A computer-virus corruption shader for any geometry: a charred voxel crust, a burning red front, cracks, shed polyhedra and drifting red zeros and ones, on SDF models and meshes. Shuffle for a completely new variant.">
<link rel="stylesheet" href="../../lib/sci.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../lib/sn-panel.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>
<div class="topbar">
  <div class="brand"><span class="dot"></span>Stella Nova</div>
  <div class="pagetitle">Corruption Shader</div>
</div>
<canvas id="view" aria-label="A 3D model on a deck, partly eaten by a black voxel corruption with a glowing red front, shed polyhedra and red zeros and ones. Drag to orbit, scroll or pinch to zoom, click the model to move the infection origin."></canvas>
<div id="nogpu" hidden>This page needs WebGPU. It runs in recent Chrome, Edge and Safari 26.</div>
<button id="gear" class="snp-gear" type="button" aria-label="Open controls" aria-controls="panel" aria-expanded="false"><i data-icon="menu"></i></button>
<div id="stageBar" role="toolbar" aria-label="Stage">
  <div id="modelChips" role="group" aria-label="Model"></div>
  <button id="btnShuffle" type="button" title="Shuffle: a new variant with completely different parameters (R)"><i data-icon="dice"></i><span>Shuffle</span></button>
  <span id="seedLbl" aria-live="polite"></span>
</div>
<div id="hint">Drag to orbit · click the model to move the infection · R to shuffle</div>
<div id="drop" hidden><span>Drop a .glb file to corrupt it</span></div>
<input id="glbFile" type="file" accept=".glb,model/gltf-binary" hidden>
<aside id="panel" class="snp" aria-label="Controls">
  <button id="sheetGrip" class="snp-grip" type="button" aria-label="Resize controls" aria-controls="panel"><span></span></button>
  <header class="snp-top">
    <h1 class="snp-ptitle">Corruption Shader</h1>
    <button id="panelClose" class="snp-iconbtn" type="button" aria-label="Close controls"><i data-icon="close"></i></button>
  </header>
  <div id="panelBody"></div>
</aside>
<nav id="dock" class="snp-dock" aria-label="Quick controls">
  <button id="dkPanel" type="button" aria-label="Controls" aria-expanded="false"><i data-icon="menu"></i><span>Controls</span></button>
  <button id="dkPrev" type="button" aria-label="Previous model"><span aria-hidden="true">‹</span><span>Prev</span></button>
  <button id="dkModel" type="button" aria-label="Next model"><i data-icon="target"></i><span id="dkModelLbl">Model</span></button>
  <button id="dkNext" type="button" aria-label="Next model"><span aria-hidden="true">›</span><span>Next</span></button>
  <button id="dkShuffle" type="button" aria-label="Shuffle"><i data-icon="dice"></i><span>Shuffle</span></button>
</nav>
<script type="module" src="main.js"></script>
</body>
</html>

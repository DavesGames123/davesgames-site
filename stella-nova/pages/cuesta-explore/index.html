<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
<meta name="theme-color" content="#0a0c11">
<title>Cuesta Park Explore</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   CUESTA PARK EXPLORE  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A shared, mobile-first street checklist for the Cuesta Park neighborhood in
   Mountain View. This file holds only the frame. main.js paints the street rows
   into #list and binds every control by id. style.css sets the look.

   The page needs no server. main.js keeps the status set in localStorage and in
   the URL hash. A person shares the link, and the reader merges the higher
   status per street. See the header comment in main.js for the share model.

   LAYOUT
     ┌───────────────────────────────────────────────┐
     │ .hdr    title · count · progress bar           │  sticky top
     │         search · filter chips                  │
     ├───────────────────────────────────────────────┤
     │ #list   street rows  (tap a row to advance)    │  scrolls
     ├───────────────────────────────────────────────┤
     │ .actions  Reset · Add street · Share           │  sticky bottom
     └───────────────────────────────────────────────┘
     #sheet   bottom sheet for add / edit / share / reset
     #toast   short status message

   ELEMENT MAP  (jump with grep -n "id=\"<id>\"" index.html)
     header count ... 'id="count"'
     progress ....... 'id="barFill"'
     search ......... 'id="search"'
     list ........... 'id="list"'
     add ............ 'id="addBtn"'
     share .......... 'id="shareBtn"'
     reset .......... 'id="resetBtn"'
     sheet .......... 'id="sheet"'
  ═══════════════════════════════════════════════════════════════════════════
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-top">
      <div>
        <div class="title">Cuesta Park Explore</div>
        <div class="sub">Mountain View &middot; street sweep</div>
      </div>
      <div class="count" id="count">0 / 0 explored</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="search-wrap">
      <input class="search" id="search" type="search" inputmode="search"
             placeholder="Search streets" autocomplete="off" autocapitalize="off">
      <button class="search-x" aria-label="Clear search">&times;</button>
    </div>
    <div class="chips">
      <button class="chip on" data-f="all">All <span class="n">0</span></button>
      <button class="chip" data-f="0">To do <span class="n">0</span></button>
      <button class="chip" data-f="1">In progress <span class="n">0</span></button>
      <button class="chip" data-f="2">Explored <span class="n">0</span></button>
    </div>
  </header>

  <main id="list"></main>

  <div class="actions">
    <button class="btn ghost" id="resetBtn" aria-label="Reset">&#8635;</button>
    <button class="btn" id="addBtn">+ Add</button>
    <button class="btn primary" id="shareBtn">Share</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0">
<meta name="theme-color" content="#0a0c11">
<title>Cuesta Park Search</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   CUESTA PARK SEARCH  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A map-first ground-search tool for the Cuesta Park area in Mountain View.
   This file holds the frame and loads Leaflet. main.js builds the map, draws
   the sector grid and the pins, and binds every control by id. style.css sets
   the look.

   The tool needs no server. main.js keeps the state in localStorage and in the
   URL hash. A person shares the link, and the reader merges the higher status
   per sector and pin. See the header comment in main.js for the share model.

   LAYOUT
     ┌───────────────────────────────────────────────┐
     │ .hdr   title · progress · legend               │
     ├───────────────────────────────────────────────┤
     │ #map   Leaflet map: sector grid + pins         │  fills
     ├───────────────────────────────────────────────┤
     │ .actions  Fit · Reset · Add pin · Share        │
     └───────────────────────────────────────────────┘

   ELEMENT MAP  (jump with grep -n "id=\"<id>\"" index.html)
     progress ....... 'id="count"'  'id="barFill"'
     map ............ 'id="map"'
     add pin ........ 'id="addBtn"'
     share .......... 'id="shareBtn"'
     reset .......... 'id="resetBtn"'
     fit ............ 'id="fitBtn"'
     sheet .......... 'id="sheet"'
  ═══════════════════════════════════════════════════════════════════════════
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-top">
      <div>
        <div class="title">Cuesta Park Search</div>
        <div class="sub">Mountain View &middot; ground search coverage</div>
      </div>
      <div class="count" id="count">0/0 sectors</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="legend">
      <span><i class="lg-red"></i> Not searched</span>
      <span><i class="lg-amb"></i> Searching</span>
      <span><i class="lg-grn"></i> Searched</span>
      <span style="color:var(--text-faint)">Tap a sector or pin to advance</span>
    </div>
  </header>

  <div id="addbar" class="addbar">Tap the map to drop a pin</div>
  <div id="map"></div>

  <div class="actions">
    <button class="btn ghost" id="fitBtn" aria-label="Fit map">&#9974;</button>
    <button class="btn ghost" id="resetBtn" aria-label="Reset">&#8635;</button>
    <button class="btn" id="addBtn">+ Pin</button>
    <button class="btn primary" id="shareBtn">Share</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="main.js"></script>
</body>
</html>

  ═══════════════════════════════════════════════════════════════════════════
   EULER FLUID  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A grid-based Eulerian fluid in about 200 lines: wind tunnel, tank and paint, with pressure, smoke and streamlines.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #17.
   Upstream file: tenMinutePhysics/17-fluidSim.html in
   https://github.com/matthias-research/pages (MIT License (notice kept above)).
   Video tutorial: https://youtu.be/iKAVRgIrUOU

   OUR ADDITIONS (davesgames.io, not upstream): the scenes beyond the
   four upstream ones (lid-driven cavity, jets), several shaped and moving
   obstacles, the field views and colour maps, the renderer, the sim kit
   GUI, the randomizer and the screensaver.

   FILES
     solver.js   upstream Fluid (MIT notice kept) + scenes and obstacles
     scene.js    sim kit schema, guard, scene config
     render.js   Canvas 2D renderer
     main.js     page controller: sim kit GUI, loop, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver director),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scene.js   every control
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
     grep -n 'export class Fluid'          solver.js  the upstream solver
  ═══════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Flag Designer // Stella Nova</title>
<!--
  ===========================================================================
   FLAG DESIGNER  ·  page shell
  ---------------------------------------------------------------------------
   The colony flag composer. A flag is a pattern, a shape, an optional emblem
   and four colours (three field colours and one emblem colour). main.js
   draws all of it with 2D canvas code. The pattern and emblem names come
   from window.SN_DATA (lib/game-data/catalog.js). The hero card shows the
   flag on a pole as a cloth that moves in the wind, or flat.

   LAYOUT
     desktop (> 900 px)  .stage (hero card)  |  #panel (five tabs)
     phone   (<= 900 px) .stage in one column; #panel is a bottom sheet with
                         a grip. A tap on a tab opens the sheet.

   SECTION MAP   (jump with grep -n "<anchor>" index.html)
     header actions ..... id="btnPng"        PNG export, copy link
     hero cloth ......... id="flagCanvas"    wave or flat view
     view controls ...... id="viewSeg"       wave / flat, wind, pause
     control panel ...... id="panel"         tabs, grip on phones
     presets ............ id="presetGrid"    filled by buildPresets()
     patterns ........... id="patternGrid"   filled by buildPatterns()
     emblems ............ id="emblemGrid"    search, group filter, size
     colours ............ id="channels"      field / second / third / emblem
     shapes ............. id="shapeGrid"     flag outline
  ===========================================================================
-->
<link href="../../vendor/fonts/space-grotesk+ibm-plex-mono+instrument-serif.4efc8126.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="kicker">Stella Nova · Colony</div>
    <h1>Flag <em>Designer</em></h1>
  </div>
  <div class="actions">
    <button class="btn ghost" id="btnLink" type="button" aria-label="Copy a link to this flag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Copy link</span>
    </button>
    <button class="btn gold" id="btnPng" type="button" aria-label="Download the flag as PNG">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Export PNG</span>
    </button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <!-- Hero. cloth.frame() draws the flag on its pole here. -->
    <div class="card hero">
      <div class="hero-wrap" id="heroWrap"><canvas id="flagCanvas" aria-label="Flag preview"></canvas></div>
      <div class="hero-meta">
        <div>
          <div class="label">Banner</div>
          <div class="flag-name" id="flagName">Custom</div>
          <div class="flag-sub" id="flagSub"></div>
        </div>
      </div>
      <div class="hero-bar">
        <div class="seg" id="viewSeg" role="group" aria-label="View">
          <button type="button" data-view="wave" class="on">Wave</button>
          <button type="button" data-view="flat">Flat</button>
        </div>
        <label class="wind"><span>Wind</span><input type="range" id="wind" min="0" max="1" step="0.05" value="0.55" aria-label="Wind strength"></label>
        <button class="chip-btn" id="btnPause" type="button" aria-pressed="false">Pause</button>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Flag controls">
    <div class="grip" id="grip" role="button" tabindex="0" aria-label="Open or close the controls"><span></span></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="presets" class="on">Presets</button>
      <button type="button" role="tab" data-tab="pattern">Pattern</button>
      <button type="button" role="tab" data-tab="emblem">Emblem</button>
      <button type="button" role="tab" data-tab="colour">Colour</button>
      <button type="button" role="tab" data-tab="shape">Shape</button>
    </nav>

    <div class="tab-body" data-body="presets">
      <div class="thumb-grid" id="presetGrid"></div>
    </div>

    <div class="tab-body" data-body="pattern" hidden>
      <div class="field-label">Stella Nova patterns</div>
      <div class="thumb-grid" id="patternGrid"></div>
      <div class="field-label">More patterns</div>
      <div class="thumb-grid" id="patternGridMore"></div>
    </div>

    <div class="tab-body" data-body="emblem" hidden>
      <div class="emblem-tools">
        <input type="search" id="emblemSearch" placeholder="Find an emblem" autocomplete="off" aria-label="Find an emblem">
        <div class="seg" id="emblemGroups" role="group" aria-label="Emblem group"></div>
      </div>
      <div class="emblem-grid" id="emblemGrid"></div>
      <label class="slider"><span>Emblem size <b id="emblemSizeVal">50%</b></span><input type="range" id="emblemSize" min="20" max="80" step="1" value="50"></label>
      <div class="field-label">Emblem place</div>
      <div class="seg wrap" id="emblemPos" role="group" aria-label="Emblem place">
        <button type="button" data-pos="center" class="on">Centre</button>
        <button type="button" data-pos="hoist">Hoist</button>
        <button type="button" data-pos="canton">Canton</button>
      </div>
    </div>

    <div class="tab-body" data-body="colour" hidden>
      <div class="channels four" id="channels" role="radiogroup" aria-label="Colour to edit">
        <button type="button" data-ch="c1" class="on"><i></i><span>Field</span></button>
        <button type="button" data-ch="c2"><i></i><span>Second</span></button>
        <button type="button" data-ch="c3"><i></i><span>Third</span></button>
        <button type="button" data-ch="ce"><i></i><span>Emblem</span></button>
      </div>
      <div class="picker" id="picker">
        <div class="sv" id="sv"><i class="knob"></i></div>
        <div class="hue" id="hue"><i class="knob"></i></div>
        <div class="hexrow">
          <span class="swatch" id="curSwatch"></span>
          <label class="hex"><span>HEX</span><input id="hexInput" type="text" maxlength="7" spellcheck="false" autocomplete="off"></label>
        </div>
        <div class="quick" id="quick"></div>
      </div>
      <div class="row-btns">
        <button class="chip-btn" id="btnSwap" type="button">Swap field and second</button>
        <button class="chip-btn" id="btnRandom" type="button">Random</button>
      </div>
    </div>

    <div class="tab-body" data-body="shape" hidden>
      <div class="shape-grid" id="shapeGrid"></div>
    </div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../lib/game-data/catalog.js"></script>
<script src="main.js"></script>
</body>
</html>

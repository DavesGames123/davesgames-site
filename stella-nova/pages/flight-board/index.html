<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Flight Board — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   FLIGHT BOARD  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A split-flap departures and arrivals board for any airport in the world.
   A click on a flight opens its detail card: route map, live telemetry,
   aircraft and weather at both ends.

   DATA PATHS
     live      adsb.lol ADS-B positions through worker/worker.js (CORS),
               plus adsbdb.com callsign routes. Free, no key. Times are
               seen (wheels up, touchdown) or estimated (marked ~).
     schedule  AeroDataBox through RapidAPI with the viewer's own key,
               kept in localStorage. Scheduled and revised times, gates,
               terminals and codeshares.
     always    data/airports.json (tools/build-airports.py), METAR from
               aviationweather.gov, aircraft from adsbdb.com.

   FILES
     main.js      boot, state, header, picker, board rows, settings, hash
     flap.js      split-flap cells and their cycle animation
     live.js      ADS-B feed -> board rows (classify, time, keep)
     schedule.js  AeroDataBox FIDS -> board rows, codeshare grouping
     detail.js    the detail card: open/close animation, map, telemetry
     geo.js       great-circle math and time formatting (no DOM)
     worker/      the Cloudflare Worker and its local runner
     tools/       build-airports.py

   LAYOUT  (# marks an element id main.js binds to)
     ┌──────────────────────────────── #board ──────────────────────────────┐
     │ #top   #tabs (Departures | Arrivals)  #apt (airport)  #clock  #gear  │
     │ #cols  column heads                                                  │
     │ #rows  one .row per flight, .now divider, #empty notice              │
     │ #foot  #feed (source, count, progress)  credits                      │
     └──────────────────────────────────────────────────────────────────────┘
     #picker   airport search overlay
     #settings data source, proxy URL, schedule key (a dialog)
     #detail   the detail card; #scrim behind it

   GREP MAP
     grep -n 'function render'       main.js   board rows
     grep -n 'function openPicker'   main.js   airport search
     grep -n 'function classify'     live.js   status from position
     grep -n 'export function open'  detail.js open animation
     grep -n 'function drawMap'      detail.js route map
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="A split-flap departures and arrivals board for any airport in the world, from live ADS-B positions. Click a flight to see its route, altitude, speed and aircraft.">
<link rel="stylesheet" href="../../vendor/fonts/inter.adf13477.css">
<link rel="stylesheet" href="style.css">
<script src="../../vendor/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
<main id="board" aria-live="off">
  <header id="top">
    <div id="tabs" role="tablist">
      <button role="tab" data-dir="dep" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19h19v2h-19zM22.07 9.64c-.21-.8-1.04-1.28-1.84-1.06L14.92 10l-6.9-6.43-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49L21 11.49c.81-.23 1.28-1.05 1.07-1.85z"/></svg><span>Departures</span></button>
      <button role="tab" data-dir="arr" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19h19v2h-19zM9.68 13.27l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-5.31-1.42-2.76-9.02L10.12 2v8.28L5.15 8.95l-.93-2.32-1.45-.39v5.17z"/></svg><span>Arrivals</span></button>
    </div>
    <button id="apt" aria-label="Pick an airport">
      <span id="aptCode" class="flaps"></span>
      <span id="aptText"><b id="aptName">Pick an airport</b><small id="aptPlace"></small></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <div id="clock"><span id="clockTime" class="flaps"></span><small id="clockDate"></small></div>
    <div id="tools">
      <label id="filterWrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="filter" type="search" placeholder="Flight, city, airline" autocomplete="off" spellcheck="false"></label>
      <button id="shares" hidden aria-pressed="false" title="Show each codeshare flight number as its own row">Codeshares</button>
      <button id="gear" aria-label="Data settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54A.48.48 0 0013.93 2h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 00-.59.22L2.73 8.47a.48.48 0 00.12.61l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.03 7.03 0 001.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg></button>
    </div>
  </header>
  <div id="cols" aria-hidden="true">
    <span class="c-time">Time</span><span class="c-flight">Flight</span><span class="c-place" id="colPlace">Destination</span><span class="c-airline">Airline</span><span class="c-extra" id="colExtra">Aircraft</span><span class="c-status">Status</span>
  </div>
  <div id="rows" role="list"></div>
  <div id="empty" hidden></div>
  <footer id="foot">
    <span id="feed"><i class="dot"></i><span id="feedText">Starting</span></span>
    <span id="credits"></span>
  </footer>
</main>

<div id="picker" hidden>
  <div class="pk-card" role="dialog" aria-label="Pick an airport">
    <div class="pk-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="pkInput" type="search" placeholder="City, airport, IATA or ICAO code" autocomplete="off" spellcheck="false">
      <button id="pkNear" title="Nearest airport to me">Near me</button>
    </div>
    <div id="pkChips"></div>
    <ol id="pkList" role="listbox"></ol>
  </div>
</div>

<div id="settings" hidden>
  <div class="st-card" role="dialog" aria-label="Data settings">
    <h2>Data</h2>
    <div class="st-mode">
      <label><input type="radio" name="mode" value="live"> <b>Live</b><small>Every airport, free. Aircraft seen by ADS-B receivers right now. Times are observed or estimated.</small></label>
      <label><input type="radio" name="mode" value="schedule"> <b>Schedule</b><small>The timetable: scheduled times, gates, terminals, codeshares. Needs your own free AeroDataBox key from RapidAPI. The key stays in this browser.</small></label>
    </div>
    <label class="st-field">AeroDataBox key (RapidAPI)<input id="stKey" type="password" autocomplete="off" spellcheck="false" placeholder="x-rapidapi-key"></label>
    <label class="st-field">Live proxy URL<input id="stProxy" type="url" autocomplete="off" spellcheck="false" placeholder="https://flight-board.example.workers.dev"></label>
    <p class="st-note" id="stNote"></p>
    <div class="st-actions"><button id="stCancel">Cancel</button><button id="stSave" class="primary">Save</button></div>
  </div>
</div>

<div id="scrim" hidden></div>
<section id="detail" hidden aria-modal="true" role="dialog"></section>

<script type="module" src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fly Duel chooser preview</title>
<meta name="robots" content="noindex">
<!--
  Stand-alone preview of ui/chooser/chooser.js with the real decks, cards
  and data/training-curve.json. It is a development page: the nav does
  not link it. The 3D table is not here. A still picture of the watch
  table (the watch capture, MODE_ART) stands in for the live table behind the veil.
  The log at the top left shows each onStart / onHow / onClose call.
  ?closable=1 shows the Close button. ?mode=play opens on the deck step.
-->
<link rel="stylesheet" href="../../../../lib/sci.css">
<link rel="stylesheet" href="chooser.css">
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #host{position:fixed;inset:0}
  #log{position:fixed;left:8px;bottom:8px;z-index:50;margin:0;max-width:60vw;font:12px/1.4 ui-monospace,Menlo,monospace;color:#c2c7d4;background:#0b0e15;border:1px solid #394155;padding:6px 8px;white-space:pre-wrap}
  #log:empty{display:none}
  #again{position:fixed;right:8px;bottom:8px;z-index:50;font:13px system-ui;padding:8px 12px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="host"></div>
<pre id="log"></pre>
<button id="again" hidden>Open the chooser again</button>
<script type="module">
import * as C from '../../game/cards.js';
import { mountChooser, MODE_ART } from './chooser.js';

const q = new URLSearchParams(location.search);
const bg = document.getElementById('bg');
function paintBg() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  bg.width = Math.round(innerWidth * dpr); bg.height = Math.round(innerHeight * dpr);
  const im = new Image();
  im.onload = () => { const g = bg.getContext('2d'), k = Math.max(bg.width / im.width, bg.height / im.height); g.drawImage(im, (bg.width - im.width * k) / 2, (bg.height - im.height * k) / 2, im.width * k, im.height * k); };
  im.src = MODE_ART.watch;
}
paintBg(); addEventListener('resize', paintBg);

let curve = null;
try { curve = await (await fetch('../../data/training-curve.json')).json(); } catch { curve = null; }
const log = s => { const el = document.getElementById('log'); el.textContent = `${s}\n${el.textContent}`.slice(0, 1200); };
const again = document.getElementById('again');
const ch = mountChooser(document.getElementById('host'), {
  decks: C.DECKS, deckOrder: C.DECK_ORDER, colours: C.COLOURS, cards: C.CARD, curve,
  initial: q.get('mode') ? { mode: q.get('mode') } : {},
  onStart: c => { log(`onStart ${JSON.stringify(c)}`); ch.close(); again.hidden = false; },
  onHow: () => log('onHow'),
  onClose: () => { log('onClose'); again.hidden = false; },
});
again.addEventListener('click', () => { again.hidden = true; ch.open({ closable: q.get('closable') === '1' }); });
ch.open({ mode: q.get('mode') || undefined, closable: q.get('closable') === '1' });
window.chooser = ch;
</script>
</body>
</html>

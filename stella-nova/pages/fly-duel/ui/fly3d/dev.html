<!doctype html>
<!--
  FLY DUEL 3D · dev page (not linked from the site)
  Opens the table scene of ui/fly3d/scene.js full window and plays live
  matches (ui/match.js) between the two model flies from
  data/pretrained.json. Without the weights or brain/fly.js, two greedy
  bots play as stand-ins and the label says so.
  Keys: 1 / 2 / 3 = slow / normal / fast, N = new game.
  GREP MAP
    grep -n 'function agents'   flies or stand-in bots
    grep -n 'async function run' the match loop (one await per record)
    grep -n 'function frame'    the render loop
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Duel 3D (dev)</title>
<link rel="stylesheet" href="../../../../lib/sci.css">
<style>
  :root { --bg:#05070c; --panel:#0b0e15; --ink:#eef0f5; --ink2:#c2c7d4; --dim:#8a91a5; --hair2:rgba(255,255,255,0.22); --flyA:#39d0f0; --flyB:#f26ad6; }
  [hidden] { display:none!important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 var(--sci-sans, Inter, system-ui, sans-serif); }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; left:16px; right:16px; top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .chip { background:var(--panel); border:1px solid var(--hair2); border-radius:8px; padding:6px 10px; }
  .life { font:600 15px var(--sci-mono, ui-monospace, Menlo, monospace); font-variant-numeric:tabular-nums; }
  .a { color:var(--flyA); } .b { color:var(--flyB); }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--hair2); border-radius:8px; padding:6px 12px; cursor:pointer; min-height:32px; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  #log { position:fixed; left:16px; right:16px; bottom:12px; color:var(--ink2); font:13px var(--sci-mono, ui-monospace, Menlo, monospace); }
  #note { color:var(--dim); font-size:12px; }
  @media (pointer:coarse) { button { min-height:44px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../../../vendor/three@0.160.0/build/three.module.js",
  "three/addons/": "../../../../vendor/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cv" aria-label="Two model fruit flies play a card duel at a table"></canvas>
<div class="hud">
  <span class="chip life"><span class="a">A</span> <span id="lifeA">20</span> · <span class="b">B</span> <span id="lifeB">20</span> · turn <span id="turn">1</span></span>
  <button data-speed="0.5">slow</button><button data-speed="1" aria-pressed="true">normal</button><button data-speed="3">fast</button>
  <button id="newGame">new game</button>
  <span id="note" class="chip">loading…</span>
</div>
<div id="log" aria-live="polite"></div>
<script type="module">
import { createDuelScene } from './scene.js';
import * as rules from '../../game/rules.js';
import { greedyBot } from '../../game/bots.js';
import { Match, agentFromFly, agentFromBot } from '../match.js';

const $ = id => document.getElementById(id);
const json = async u => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } };
const [C, PT] = await Promise.all([json('../../data/connectome.json'), json('../../data/pretrained.json')]);

// Two agents: the pretrained flies, or two greedy bots as stand-ins.
async function agents() {
  try {
    if (!C || !PT?.A || !PT?.B) throw new Error('no connectome or weights');
    const { Fly } = await import('../../brain/fly.js');
    const A = Fly.fromJSON(C, PT.A), B = Fly.fromJSON(C, PT.B);
    $('note').textContent = 'Model flies with pretrained weights (a model of the mushroom body, not a real fly). Drag to orbit.';
    return [agentFromFly(A, 'Fly A'), agentFromFly(B, 'Fly B')];
  } catch (e) {
    console.warn('dev: flies not loaded, greedy bots play', e);
    $('note').textContent = 'Stand-in: two greedy bots play (fly model not loaded). Drag to orbit.';
    return [agentFromBot(greedyBot(), 'Fly A (bot)'), agentFromBot(greedyBot(), 'Fly B (bot)')];
  }
}

const cv = $('cv');
const scene = createDuelScene(cv, { connectomes: C ? [C, C] : null, names: ['Fly A', 'Fly B'] });
addEventListener('resize', () => scene.resize());
const AG = await agents();

let gen = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function run() {
  const my = ++gen;
  const m = new Match(rules, AG, { seed: 1 + Math.floor(Math.random() * 1e6), names: ['Fly A', 'Fly B'] });
  scene.setState(m.state);
  let r;
  while (my === gen && (r = m.next())) {
    $('log').textContent = r.text;
    await scene.play(r);
    if (my !== gen) return;
    const s = m.state;
    $('lifeA').textContent = s.players[0].life; $('lifeB').textContent = s.players[1].life; $('turn').textContent = s.turn;
  }
  if (my !== gen) return;
  const end = m.over();
  $('log').textContent = end ? (end.winner < 0 ? `Draw (${end.reason}).` : `${['Fly A', 'Fly B'][end.winner]} wins (${end.reason}).`) : '';
  await sleep(5000);
  if (my === gen) run();
}

function setSpeed(v) {
  scene.setSpeed(v);
  for (const b of document.querySelectorAll('[data-speed]')) b.setAttribute('aria-pressed', String(+b.dataset.speed === v));
}
for (const b of document.querySelectorAll('[data-speed]')) b.addEventListener('click', () => setSpeed(+b.dataset.speed));
$('newGame').addEventListener('click', () => run());
addEventListener('keydown', e => {
  if (e.key === '1') setSpeed(0.5); else if (e.key === '2') setSpeed(1); else if (e.key === '3') setSpeed(3);
  else if (e.key === 'n' || e.key === 'N') run();
});

let last = performance.now();
function frame(t) {
  scene.render((t - last) / 1000); last = t;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
scene.ready.then(info => console.info('fly duel 3d:', info));
run();
window.flyDuel3d = scene;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Planet Forge // Stella Nova</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   PLANET FORGE  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. A procedural planet generator with two paths
   (rocky and gas giant) that makes a full PBR map set, and a WebGPU view
   with a physically based atmosphere.

   MODULES
     noise.js    seeded sphere noise (simplex, fBm, ridged, warp, curl)
     presets.js  recipe defaults, presets, slider schema, JSON
     rocky.js    terrestrial generator      gas.js   gas / ice giants
     maps.js     map stripes, erosion pass, normals, AO, export images
     erode.js    drainage, valley carving, talus
     png.js      PNG encoder                budget.js memory guards
     worker.js + pool.js   generation across module workers
     atmo.js + shaders/atmo-*.wgsl   atmosphere LUTs
     render.js + shaders/planet.wgsl the view
     clock.js    time rate, simulated clock
     clouds.js + shaders/clouds.wgsl  the evolving cloud deck and cirrus
     archetypes.js  new families, giant palettes   randomize.js  draws, locks, links
     studio-core.js + studio.js   the Studio tab (batch renders to PNG)
     main.js     the GUI, camera, downloads   saver.js window.snSaver

   LAYOUT  (# marks an element id main.js binds to)
     #view (canvas) fills the window. #panel: a left column on a desktop,
     a bottom sheet above #dock on a phone (portrait) or a right drawer
     (landscape). Tabs: planet (presets, seed, randomize: #rMode #roll
     #share #locks #mutAmt #mutate), shape, sky, maps, studio (studio.js
     binds the #st* ids). #mapView shows one map
     large. #nogpu replaces the view without WebGPU (maps still work).
  ═══════════════════════════════════════════════════════════════════════════
-->
<link href="../../vendor/fonts/inter.adf13477.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>
<canvas id="view"></canvas>
<div id="nogpu" hidden><b>WebGPU is not available here.</b><span>The generator and the map downloads still work. The 3D view needs a browser with WebGPU (Chrome, Edge, Safari 26).</span></div>

<header id="top"><span class="brand">Stella Nova</span><span class="sep">/</span><span class="name">Planet Forge</span><span id="status"></span><span id="clock" title="time rate · planet days"></span></header>
<div id="prog"><i id="progFill"></i></div>

<aside id="panel">
  <div id="sheetGrip"><span></span></div>
  <nav id="tabs">
    <button data-tab="planet" class="on">Planet</button><button data-tab="shape">Shape</button><button data-tab="sky">Sky</button><button data-tab="maps">Maps</button><button data-tab="studio">Studio</button>
  </nav>
  <section data-pane="planet" class="on">
    <div class="seg" id="kind"><button data-kind="rocky" class="on">Rocky</button><button data-kind="gas">Gas giant</button></div>
    <div id="presets" class="presets"></div>
    <p id="blurb" class="blurb"></p>
    <div class="row"><label for="seed">Seed</label><input id="seed" type="number" min="0" step="1"><button id="dice" title="New seed">New seed</button></div>
    <div class="row"><label for="res">Maps</label><select id="res"></select><button id="gen" class="primary">Generate</button></div>
    <p id="resNote" class="note"></p>
    <h4>Randomize</h4>
    <div class="seg small" id="rMode"></div>
    <div class="row"><button id="roll" class="primary">Roll a planet</button><button id="share" title="Copy a link to this planet">Copy link</button></div>
    <div id="locks" class="locks"></div>
    <div class="ctl"><label>mutate amount <output id="oMut"></output></label><input id="mutAmt" type="range" min="0" max="1" step="0.01" value="0.3"></div>
    <button id="mutate" class="wide">Mutate</button>
  </section>
  <section data-pane="shape"><div id="shapeCtl"></div><button id="resetShape" class="wide">Reset to preset</button></section>
  <section data-pane="sky">
    <div id="skyCtl"></div>
    <h4>View</h4>
    <div class="ctl"><label>exposure <output id="oExp"></output></label><input id="exp" type="range" min="0.1" max="3" step="0.01" value="0.65"></div>
    <div class="ctl"><label>sun azimuth <output id="oSun"></output></label><input id="sunAz" type="range" min="0" max="360" step="0.5" value="50"></div>
    <div class="ctl"><label>sun elevation <output id="oSunEl"></output></label><input id="sunEl" type="range" min="-60" max="60" step="0.5" value="12"></div>
    <div class="ctl"><label>time rate <output id="oRate"></output></label><input id="rate" type="range" min="0" max="1" step="0.001"></div>
    <div id="ratePresets" class="presets rates"></div>
    <div class="toggles">
      <label><input id="tSun" type="checkbox" checked> moving sun</label>
      <label><input id="tSpin" type="checkbox" checked> spin</label>
      <label><input id="tClouds" type="checkbox" checked> clouds</label>
      <label><input id="tAtmo" type="checkbox" checked> atmosphere</label>
    </div>
  </section>
  <section data-pane="maps">
    <p class="note" id="mapNote"></p>
    <div id="mapGrid" class="mapgrid"></div>
    <div class="row wrap"><button id="dlZip" class="primary">Download all (ZIP)</button><button id="dlJson">Recipe JSON</button><label class="file">Load JSON<input id="loadJson" type="file" accept=".json,application/json"></label></div>
  </section>
  <section data-pane="studio">
    <div class="seg small" id="stSource"><button data-src="random">Random</button><button data-src="variations">Variations</button><button data-src="list">From files</button></div>
    <div class="row" id="stModeRow"><label for="stMode">Mode</label><select id="stMode"></select></div>
    <div class="row" id="stCountRow"><label for="stCount">Count</label><input id="stCount" type="number" min="1" max="200" value="8"><label for="stSeed">Seed</label><input id="stSeed" type="number" min="0" step="1"></div>
    <div class="ctl" id="stAmtRow"><label>variation amount <output id="oStAmt"></output></label><input id="stAmt" type="range" min="0.05" max="1" step="0.01" value="0.35"></div>
    <div class="row" id="stFilesRow"><label class="file">Load recipes<input id="stFiles" type="file" accept=".json,application/json" multiple></label></div>
    <h4>Render</h4>
    <div class="row"><label for="stRes">Size</label><select id="stRes"></select><select id="stAspect" aria-label="Aspect"></select></div>
    <div class="row"><label for="stFraming">Shot</label><select id="stFraming"></select><select id="stBg" aria-label="Background"></select></div>
    <div class="toggles"><label><input id="stMatch" type="checkbox" checked> same shot for all</label></div>
    <div class="row"><button id="stStart" class="primary">Render</button><button id="stCancel">Cancel</button></div>
    <p class="note" id="stNote"></p>
    <div id="stGallery" class="stgallery"></div>
    <div class="row wrap"><button id="stZip">Download all (ZIP)</button><button id="stClear">Clear</button></div>
  </section>
</aside>

<nav id="dock">
  <button data-tab="planet">Planet</button><button data-tab="shape">Shape</button><button data-tab="sky">Sky</button><button data-tab="maps">Maps</button><button data-tab="studio">Studio</button><button id="dockRate" title="Time rate">6 min</button><button id="dockDice" title="New seed">⟳</button>
</nav>

<div id="mapView" hidden><header><b id="mvTitle"></b><span id="mvNote"></span><button id="mvSave">Download PNG</button><button id="mvClose">Close</button></header><canvas id="mvCanvas"></canvas></div>

<script src="../../vendor/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>

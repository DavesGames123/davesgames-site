<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Stella Nova // Hohmann Transfer Calculator</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   HOHMANN TRANSFER CALCULATOR  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. main.js draws the whole simulation into the single
   canvas and wires every button and readout by id. This file lays out the
   frame. equations.js fills the reference equations in the side panel with
   static MathJax SVG (made by typeset.mjs). No math library loads at run
   time, because KaTeX HTML layout fails in Safari.

   HEAD LOAD ORDER
     1. fonts       Google Fonts: Inter (interface), STIX Two Text (headings
                    and maths). Numbers use the system monospace.
     2. style.css   the page stylesheet
     (the scripts load at the end of body, after the markup exists)

   LAYOUT  (the ▓ mark shows an element id)
     ┌───────────────────────────────────────────────────────────────────┐
     │ topbar ▓simStatus ▓smsg ▓bodyCount ▓fpsRead ▓timeRead              │
     ├───────────────────────────────────────────────────────────────────┤
     │ action bar: preset cards ▶ ▓btnLaunch ▓btnHop Clear ▓spSlider      │
     ├──────────────────────────────────────────┬────────────────────────┤
     │ canvas ▓cvs                              │  ▓mathpanel             │
     │                                          │   ▓tbar (banner)        │
     │                                          │   ▓eqPanel (reference)  │
     │   ▓guide  (next step, centred)           │   ▓mathcontent (live)   │
     │ ▓hoverbox                    ▓fabMath    │                         │
     └──────────────────────────────────────────┴────────────────────────┘
   The canvas text never sits under a panel: resize() in data.js frames the
   orbits in the part of the canvas above ▓guide and ▓hoverbox, and the
   canvas labels go through placeLabel() in render.js, which skips a
   position that overlaps a label already drawn.
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="color-scheme" content="dark">
<link href="../../vendor/fonts/inter+stix-two-text.53c07ba3.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- In-frame guard: inside the site shell iframe, add .in-frame so the CSS can
     hide this page's own topbar. Inline so it runs before the body paints. -->
<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>

<!-- Topbar: system name plus live readouts (status, planet count, FPS, time). -->
<div class="topbar">
  <div class="topbar-l">
    <span class="sys-name">Stella Nova</span>
    <span class="sys-sub">Orbital transfer calculator</span>
    <div class="sys-status" id="simStatus">Running</div>
  </div>
  <div class="topbar-r">
    <span class="smsg" id="smsg">Select a planet</span>
    <span class="hide-narrow">Planets <strong id="bodyCount">0</strong></span>
    <span class="hide-narrow">FPS <strong id="fpsRead">60</strong></span>
    <span>t <strong id="timeRead">0.00</strong> yr</span>
  </div>
</div>

<!-- ACTION BAR (presets + actions, always visible) -->
<!-- Each preset card carries an inline SVG mini map of its system and calls
     loadPreset(name,this). The action buttons call launch, toggleHopMode, and
     clearSel; the speed slider feeds the sim time scale in main.js. -->
<nav class="action-bar">
  <span class="ab-label">Systems</span>

  <!-- Random system preset. -->
  <button class="pcard active" data-preset="random" onclick="loadPreset('random',this)">
    <span class="pcard-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="2.8" fill="#ffe080"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="rgba(150,200,255,0.3)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="13" fill="none" stroke="rgba(150,200,255,0.3)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(150,200,255,0.3)" stroke-width="0.4"/>
      <circle cx="26" cy="20" r="1.6" fill="#ffc832"/>
      <circle cx="20" cy="13" r="1.4" fill="#5cd8e8"/>
      <circle cx="9" cy="22" r="2" fill="#e87466"/>
      <circle cx="33" cy="15" r="1.7" fill="#7ad87a"/>
    </svg></span>
    <span class="pcard-name">Random</span>
  </button>

  <!-- Inner system preset: tight cluster of small orbits. -->
  <button class="pcard" data-preset="inner" onclick="loadPreset('inner',this)">
    <span class="pcard-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="3.2" fill="#ffe080"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="rgba(150,200,255,0.5)" stroke-width="0.5"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(150,200,255,0.5)" stroke-width="0.5"/>
      <circle cx="20" cy="20" r="13" fill="none" stroke="rgba(150,200,255,0.5)" stroke-width="0.5"/>
      <circle cx="27" cy="20" r="1.5" fill="#ffc832"/>
      <circle cx="20" cy="10" r="1.5" fill="#5cd8e8"/>
      <circle cx="9" cy="22" r="1.6" fill="#e87466"/>
    </svg></span>
    <span class="pcard-name">Inner</span>
  </button>

  <!-- Outer system preset: a few widely spaced giants. -->
  <button class="pcard" data-preset="outer" onclick="loadPreset('outer',this)">
    <span class="pcard-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="2.8" fill="#ffe080"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="rgba(150,200,255,0.4)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(150,200,255,0.4)" stroke-width="0.4"/>
      <circle cx="29" cy="20" r="1.6" fill="#5cd8e8"/>
      <circle cx="9" cy="14" r="2.2" fill="#e87466"/>
    </svg></span>
    <span class="pcard-name">Outer</span>
  </button>

  <!-- Laplace system preset: exact 2:1 period resonance chain. -->
  <button class="pcard" data-preset="laplace" onclick="loadPreset('laplace',this)">
    <span class="pcard-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="2.5" fill="#ffe080"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="26" cy="20" r="1.3" fill="#ffc832"/>
      <circle cx="30" cy="20" r="1.5" fill="#5cd8e8"/>
      <circle cx="34" cy="20" r="1.7" fill="#e87466"/>
      <circle cx="38" cy="20" r="1.9" fill="#7ad87a"/>
    </svg></span>
    <span class="pcard-name">Laplace</span>
  </button>

  <!-- Binary system preset: two close planets. -->
  <button class="pcard" data-preset="binary" onclick="loadPreset('binary',this)">
    <span class="pcard-icon"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="3" fill="#ffe080"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="20" cy="20" r="13" fill="none" stroke="rgba(150,200,255,0.45)" stroke-width="0.4"/>
      <circle cx="29" cy="20" r="2.2" fill="#ffc832"/>
      <circle cx="33" cy="20" r="2.4" fill="#5cd8e8"/>
    </svg></span>
    <span class="pcard-name">Binary</span>
  </button>

  <span class="ab-divider"></span>

  <!-- Actions: Launch fires the transfer (disabled until both orbits picked),
       Hop toggles chained-transfer mode, Clear resets the selection. -->
  <button class="act-btn go" id="btnLaunch" disabled onclick="launch()">Launch</button>
  <button class="act-btn green" id="btnHop" onclick="toggleHopMode()">Hop</button>
  <button class="act-btn red" onclick="clearSel()">Clear</button>

  <span class="ab-divider"></span>

  <!-- Speed control: sets sim years per real second. -->
  <div class="speed-ctl">
    <span>Speed</span>
    <input type="range" id="spSlider" min="0.05" max="0.5" step="0.005" value="0.25">
    <span class="speed-val" id="spVal">0.25&times;</span>
  </div>
</nav>

<!-- Main split: the render canvas on the left, the live math panel on the right. -->
<div id="main">

  <!-- Canvas area: the simulation surface plus its floating overlays. -->
  <div class="canvas-area" id="canvasArea">
    <!-- main.js sizes and draws everything into this one canvas. -->
    <canvas id="cvs"></canvas>
    <!-- Hover readout: shows the pointed-at planet's orbital data. -->
    <div class="hoverbox" id="hoverbox">hover over a planet</div>

    <!-- Next-step prompt. main.js (drawGuidance in render.js) sets its text. -->
    <div class="guide" id="guide" aria-live="polite"><div class="g1" id="guide1"></div><div class="g2" id="guide2"></div><div class="g3" id="guide3"></div></div>

    <!-- Mobile: floating button and backdrop that open or close the math drawer. -->
    <button class="fab" id="fabMath" onclick="toggleMathDrawer()">Math &equiv;</button>
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeMathDrawer()"></div>
  </div>

  <!-- Math panel: main.js fills tbar with a status banner and mathcontent with
       the live step-by-step computation. -->
  <aside id="mathpanel">
    <div class="p-head">
      <span>Live computation</span>
      <button class="p-close" onclick="closeMathDrawer()" aria-label="Close">&#x2715;</button>
    </div>
    <div id="tbar"></div>
    <div id="mathscroll">
    <!-- REFERENCE EQUATIONS. equations.js fills the eq-* rows with static
         SVG. eqState flips to LIVE (main.js) once a transfer is computed. -->
    <section class="eq-panel" id="eqPanel">
      <div class="eq-head">
        <span class="lbl">Equations</span>
        <span class="eq-state" id="eqState">Reference</span>
        <button class="eq-collapse" id="eqCollapseBtn" title="Hide the equations" aria-expanded="true">&#9662;</button>
      </div>
      <div class="eq-body">
        <div class="eq-block">
          <div class="eq-sublabel">Vis-viva · speed on any conic</div>
          <div class="eq-row" id="eq-visviva"></div>
        </div>
        <div class="eq-block">
          <div class="eq-sublabel">Transfer ellipse · Δv burns</div>
          <div class="eq-row" id="eq-atransfer"></div>
          <div class="eq-row" id="eq-dv1"></div>
          <div class="eq-row" id="eq-dv2"></div>
        </div>
        <div class="eq-block">
          <div class="eq-sublabel">Transit time · launch window</div>
          <div class="eq-row" id="eq-time"></div>
          <div class="eq-row" id="eq-phi"></div>
        </div>
      </div>
    </section>
      <div id="mathcontent"></div>
    </div>
  </aside>

</div>

<!-- equations.js mounts the static SVG reference equations. -->
<script src="equations.js"></script>

<!-- main.js split into ordered classic scripts. One shared global scope, run in
     sequence: data.js (constants, state, canvas, presets, orbital math, windows,
     grading) → render.js (drawing, ship, main loop) → input.js (interaction) →
     mathpanel.js (live maths panel, plain HTML) → main.js (HUD setters, INIT boot). -->
<script src="data.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="mathpanel.js"></script>
<script src="main.js"></script>
</body>
</html>

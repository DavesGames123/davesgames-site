<!--
  ═══════════════════════════════════════════════════════════════════════════
   JOINT SIMULATION  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   XPBD joints: hinges, motors, servos, ball, prismatic and cylinder
   joints, in the three upstream scenes and five made ones. The page
   starts a random scene on load and keeps it running. Drag a body to
   pull it; the joystick drives the steering scene.

   CREDIT. The upstream demo is Ten Minute Physics #25 by Matthias Müller:
   tenMinutePhysics/25-joints.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of engine.js). Video: https://youtu.be/YVaQxeWGlJA. The
   scene files basicJoints.json, steering.json and pendulum.json are the
   upstream files, unchanged. The credit bar (kit.js) names the author.

   OUR ADDITIONS (davesgames.io, not upstream): the made scenes, the
   autopilot drive, the look, the GUI and the saver.

   FILES
     engine.js   the upstream joint engine (site changes marked "site:")
     scenes.js   made scenes in the importer format, schema, rules
     app.js      page controller: kit, stage, load, colour, drive, loop
     saver.js    screensaver shots (sim kit director)
     main.js     credit record + start()
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, 3D stage),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scenes.js  controls and random rules
     grep -n 'export const SHOTS'          saver.js   the screensaver shots
     grep -n 'export class Joint'          engine.js  the upstream joint
  ═══════════════════════════════════════════════════════════════════════════
-->

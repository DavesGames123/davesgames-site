<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MagnetLab — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   MAGNETLAB  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. main.js paints everything into #sim-canvas and binds
   the panel controls by id; equations.js typesets the equation overlay as
   MathJax SVG (lib/sci-math.js) from the data-tex attributes. This file
   lays out the left control panel, the canvas area, and the status bar.

   HEAD LOAD ORDER  (order matters)
     1. style.css    the page stylesheet
     2. lib/sci.css  shared science type (STIX Two Text, Inter, the system
                     mono) and the math colors .m1 to .m6; it loads the fonts
     3. equations.js ES module, typesets the equation panel
     4. main.js      classic script, runs the whole simulator

   LAYOUT  (# marks an element id)
     ┌─────────────────────────────────────────────────────────────────┐
     │ topbar: "Stella Nova · MagnetLab"          (hidden when in frame) │
     ├────────────┬────────────────────────────────────────────────────┤
     │ #panel     │  #canvas-wrap                                        │
     │  add grid  │    <canvas #sim-canvas>  field tracers, arrows, mags │
     │  #mag-list │    #eq-panel  ▷  MathJax overlay (collapsible)        │
     │  toggles   │                                                      │
     │  sim btns  │                                                      │
     ├────────────┴────────────────────────────────────────────────────┤
     │ #status-bar: magnets · tracers · fps · B · zoom · dims           │
     └──────────────────────────────────────────────────────────────────┘
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../lib/sci.css">
</head>
<body>
<!-- In frame guard: when loaded inside the site shell iframe, add .in-frame so
     the CSS hides this page's own topbar. Kept inline so it runs before the body
     renders and there is no flash of the topbar. -->
<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>

<!-- Mobile hamburger: toggles the .mob-open class on #panel (see main.js). -->
<button id="mob-btn" onclick="toggleMobilePanel()">☰</button>

<!-- Top status strip; hidden when the page runs inside the shell. -->
<div class="topbar">
  <div class="topbar-l"><span class="sys-name">Stella Nova</span></div>
  <div class="topbar-r">MagnetLab</div>
</div>

<div id="main">
  <!-- LEFT PANEL -->
  <div id="panel"><div class="p-body">
    <!-- Add Magnet: each button calls addMagnet(type); type strings match the
         switch in createMagnet() inside main.js. -->
    <div class="p-section">
      <div class="p-sec-lbl">Add magnet</div>
      <div class="add-grid">
        <button class="add-btn" onclick="addMagnet('bar')">Bar</button>
        <button class="add-btn" onclick="addMagnet('dipole')">Dipole</button>
        <button class="add-btn" onclick="addMagnet('solenoid')">Solenoid</button>
        <button class="add-btn" onclick="addMagnet('horseshoe')">Horseshoe</button>
        <button class="add-btn" onclick="addMagnet('buzzer')">Buzzer</button>
        <button class="add-btn" onclick="addMagnet('ring')">Ring</button>
        <button class="add-btn" onclick="addMagnet('quadrupole')">Quad</button>
        <button class="add-btn" onclick="addMagnet('halbach')">Halbach</button>
      </div>
    </div>
    <!-- Magnets: rebuildMagnetList() fills #mag-list with one card per magnet,
         each carrying strength, angle, spin, and fixed/dynamic controls. -->
    <div class="p-section">
      <div class="p-sec-lbl">Magnets</div>
      <div class="mag-list" id="mag-list"></div>
    </div>
    <!-- Field Display: toggles for the three field visualisations plus the
         tracer count, speed, and trail sliders. -->
    <div class="p-section">
      <div class="p-sec-lbl">Field display</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="tog-btn on" id="tog-tracers" onclick="toggleTracers()">Field tracers</button>
        <button class="tog-btn on" id="tog-arrows" onclick="toggleArrows()">Field arrows</button>
        <button class="tog-btn off" id="tog-grid" onclick="toggleGrid()">Field heatmap</button>
      </div>
      <div class="mag-row" style="margin-top:6px">
        <span class="mag-row-lbl">Count</span>
        <input type="range" id="sl-tracer-count" min="200" max="5000" value="2500" step="50" oninput="updateTracerCount(this)">
        <span class="val" id="vl-tracer-count">2500</span>
      </div>
      <div class="mag-row">
        <span class="mag-row-lbl">Speed</span>
        <input type="range" id="sl-tracer-speed" min="0.1" max="5" value="1.5" step="0.1" oninput="updateTracerSpeed(this)">
        <span class="val" id="vl-tracer-speed">1.5</span>
      </div>
      <div class="mag-row">
        <span class="mag-row-lbl">Trail</span>
        <input type="range" id="sl-tracer-trail" min="5" max="80" value="40" step="1" oninput="updateTracerTrail(this)">
        <span class="val" id="vl-tracer-trail">40</span>
      </div>
    </div>
    <!-- Simulation transport: play/pause, stop (zero velocities), reset (also
         clears spin), and clear (remove all magnets). -->
    <div class="p-section">
      <div class="p-sec-lbl">Simulation</div>
      <div class="sim-btns">
        <button class="sim-btn active" id="btn-play" onclick="togglePlay()">Play</button>
        <button class="sim-btn" onclick="stopAll()">Stop</button>
        <button class="sim-btn" onclick="resetSim()">Reset</button>
        <button class="sim-btn warn" onclick="clearAll()">Clear</button>
      </div>
    </div>
  </div></div>

  <!-- Canvas area: the wrapper is what the ResizeObserver in main.js watches,
       so CW and CH follow this box. The tap overlay closes the mobile panel. -->
  <div class="mob-overlay" onclick="toggleMobilePanel()"></div>
  <div id="canvas-wrap">
    <canvas id="sim-canvas"></canvas>

    <!-- Equation panel overlays the canvas; equations.js paints it and wires
         the collapse toggle. -->
    <section class="eq-panel collapsed" id="eq-panel">
      <div class="eq-head" id="eq-toggle">
        <span class="lbl">Maxwell's equations</span>
        <span class="arrow">Show</span>
      </div>
      <div class="eq-blocks">
        <div class="eq-block">
          <div class="eq-sublabel">Gauss's law, magnetic</div>
          <div class="eq-row sci-eq" id="eq-gauss-b" data-tex="\nabla\cdot\vec{B}=0"></div>
        </div>
        <div class="eq-block">
          <div class="eq-sublabel">Ampère–Maxwell</div>
          <div class="eq-row sci-eq" id="eq-ampere" data-tex="\nabla\times\vec{B}=\mu_0\vec{J}+\mu_0\epsilon_0\frac{\partial\vec{E}}{\partial t}"></div>
        </div>
        <div class="eq-block">
          <div class="eq-sublabel">Dipole field</div>
          <div class="eq-row sci-eq" id="eq-dipole" data-tex="\vec{B}(\vec{r})=\frac{\mu_0}{4\pi}\,\frac{3(\vec{m}\cdot\hat{r})\,\hat{r}-\vec{m}}{r^3}"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Status bar: main.js updates these readouts every frame (magnet count,
     tracer count, fps, field magnitude at centre, zoom, canvas dims). -->
<div id="status-bar">
  <span id="st-magnets">0 magnets</span><span class="sep"></span>
  <span id="st-tracers">2500 tracers</span><span class="sep"></span>
  <span id="st-fps">-- fps</span><span class="sep"></span>
  <span id="st-field">B: 0.00</span><span class="sep"></span>
  <span id="st-zoom">1.0×</span><span class="sep"></span>
  <span id="st-dims">--</span>
</div>

<!-- Equation panel renderer (MathJax SVG through lib/sci-math.js). -->
<script type="module" src="equations.js"></script>

<!-- The simulator: physics, tracers, rendering, and all control wiring. -->
<script src="main.js"></script>
</body>
</html>

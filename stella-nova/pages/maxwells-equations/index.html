<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Maxwell's equations — Stella Nova · davesgames.io</title>
<meta name="description" content="Maxwell's equations as geometry: fields as differential forms, the exterior derivative and Stokes' theorem, the four laws as pictures you can turn, F = dA and d⋆F = J, and light.">
<!--
  ═══════════════════════════════════════════════════════════════════════════
   MAXWELL'S EQUATIONS  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup. main.js (ES module) runs a stepper through five chapters.
   Each step has a title, TeX (MathJax SVG through lib/sci-math.js), text,
   controls and a live 3D scene on #stage (three.js r160, vendored).

   HEAD LOAD ORDER  (order matters)
     1. gpu-guard.js, wishlist.js, stats-beacon.js   site scripts, in this order
     2. style.css     the page stylesheet
     3. sci.css       shared science type (STIX Two Text, Inter) and the math
                      colours .m1 to .m6. It loads the fonts.
     4. importmap     three r160 and its addons from vendor/
   main.js loads at the end of body.

   LAYOUT  (# marks an element id main.js binds to)
     ┌──────────────┬────────────────────────────────────────────────────┐
     │ #panel       │ #stage      the 3D scene (WebGL)                   │
     │  title       │ #labels     HTML labels that follow 3D points      │
     │  #chapters   │ #readout    live numbers, colour-coded             │
     │  #step       │ #hint       how to turn the scene                  │
     │  #controls   │                                                    │
     │  #nav        │                                                    │
     └──────────────┴────────────────────────────────────────────────────┘
   PHONE (max-width 768px, or a short landscape touch screen)
     #stage fills the screen. #panel is a bottom sheet in portrait (a right
     drawer in landscape). #dock at the base: previous, the step title
     (opens and closes the sheet), next. main.js frames the scene in the
     free part of the canvas (stage.setOcclusion).
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../lib/sci.css">
<script type="importmap">
{ "imports": {
  "three": "../../vendor/three@0.160.0/build/three.module.js",
  "three/addons/": "../../vendor/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>
<header class="topbar">
  <span class="brand">Stella Nova</span><span class="pagetitle">Maxwell's equations</span>
</header>

<canvas id="stage" aria-label="The scene of the current step. Drag to turn it."></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="readout" aria-live="polite"></div>
<p id="hint">Drag to turn · scroll or pinch to zoom</p>
<div id="nogl" hidden>
  <p class="ng-title">This browser has no WebGL</p>
  <p>The scenes need WebGL. The text and the equations of each step still work.</p>
</div>

<aside id="panel">
  <div id="sheetGrip" role="button" aria-label="Resize the text sheet"><span></span></div>
  <div class="p-head">
    <p class="kicker">Electromagnetism, read as geometry</p>
    <h1>Maxwell's equations</h1>
  </div>
  <nav id="chapters" aria-label="Chapters"></nav>
  <article id="step">
    <p class="step-num" id="stepNum"></p>
    <h2 id="stepTitle"></h2>
    <div id="stepTex"></div>
    <div id="stepText"></div>
    <div id="controls"></div>
  </article>
  <div id="nav">
    <button id="prev" aria-label="Previous step">← Previous</button>
    <span id="count"></span>
    <button id="next" aria-label="Next step">Next →</button>
  </div>
</aside>

<nav id="dock" aria-label="Steps">
  <button id="dockPrev" aria-label="Previous step">‹</button>
  <button id="dockTitle" aria-expanded="true"><span id="dockNum"></span><span id="dockName"></span></button>
  <button id="dockNext" aria-label="Next step">›</button>
</nav>

<script type="module" src="main.js"></script>
</body>
</html>

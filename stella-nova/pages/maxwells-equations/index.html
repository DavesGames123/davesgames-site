<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maxwell's Equations // Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   MAXWELL'S EQUATIONS  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup for the four-law explorer. main.js draws the scene of the
   active law into #sim-canvas, fills the law list, the card, the legend,
   the readout and the controls. This file holds no field code.

   HEAD LOAD ORDER   (order matters)
     ● fonts         Space Grotesk, IBM Plex Mono, Instrument Serif (the
                     shell fonts)
     ● style.css     the page stylesheet
     ● equations.js  MathJax SVG of each law (GENERATED by typeset.mjs)
     ● main.js       at body end, runs the explorer after markup exists

   LAYOUT   (the leading marker is an element id)
     ┌──────────────┬───────────────────────────────────────────────────────┐
     │ #panel       │ #canvas-wrap                                           │
     │  title        │   #card     law name · differential form ·            │
     │  #laws        │             integral form · plain line                │
     │  #ctrl-area   │   #sim-canvas  the field scene, below the card        │
     │  #about-text  │   #legend (bottom left) · #readout (bottom right)     │
     └──────────────┴───────────────────────────────────────────────────────┘

   PHONE LAYOUT  (max-width 768px, or a short landscape touch screen)
     #dock       at the base: #dockPanel opens the panel, #dockEqs selects
                 a law. All are one tap.
     #panel      portrait: a bottom sheet above the dock. #sheetGrip toggles
                 half and full height, and a drag down closes the sheet.
                 landscape: a drawer on the right edge.
     main.js fits the scene in the canvas area below the card.
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="equations.js"></script>
</head>
<body>
<!-- In-frame guard: inside the site shell iframe, add .in-frame so the CSS hides
     this page's own topbar. Inline so it runs before the body paints. -->
<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>
<header class="topbar">
  <span class="sys-name">Stella Nova</span><span class="sys-page">Maxwell's Equations</span>
</header>
<div id="main">
  <!-- Control panel: title, the four laws, the active law's controls, About. -->
  <aside id="panel">
  <!-- Phone only: the grip of the bottom sheet. -->
  <div id="sheetGrip" role="button" aria-label="Resize controls"><span></span></div>
  <div class="p-body">
    <div class="p-head">
      <p class="kicker">Electromagnetism</p>
      <h1>Maxwell's Equations</h1>
      <p class="lede">Four laws, and all of electricity, magnetism and light follows from them.</p>
    </div>
    <!-- The four laws. main.js fills one button per law (numeral, name, form). -->
    <nav class="laws" id="laws" aria-label="The four laws"></nav>
    <section class="p-section" id="ctrl-section">
      <h2 class="p-sec-lbl">Controls</h2>
      <div class="ctrl-area" id="ctrl-area"></div>
    </section>
    <section class="p-section">
      <h2 class="p-sec-lbl">About</h2>
      <p class="about" id="about-text"></p>
    </section>
  </div></aside>
  <!-- Canvas stage: the field scene, the law card, the legend and the readout. -->
  <main id="canvas-wrap">
    <canvas id="sim-canvas"></canvas>
    <div class="card" id="card" aria-live="polite">
      <p class="card-kicker"><span class="card-num" id="card-num"></span><span id="card-name"></span></p>
      <div class="card-eq" id="card-eq"></div>
      <div class="card-int"><span class="card-int-lbl">integral form</span><span id="card-int"></span></div>
      <p class="card-line" id="card-line"></p>
    </div>
    <ul class="legend" id="legend" aria-label="Legend"></ul>
    <div class="readout" id="readout"></div>
  </main>
</div>
<!-- Phone only: the dock. The panel button and one button per law. -->
<nav id="dock" aria-label="Quick controls">
  <button id="dockPanel" aria-label="Controls" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <div id="dockEqs" class="seg">
    <button data-eq="0" onclick="switchEq(0)" aria-label="Gauss's Law"><span class="n">I</span><span class="s">∇·E</span></button>
    <button data-eq="1" onclick="switchEq(1)" aria-label="No Monopoles"><span class="n">II</span><span class="s">∇·B</span></button>
    <button data-eq="2" onclick="switchEq(2)" aria-label="Faraday's Law"><span class="n">III</span><span class="s">∇×E</span></button>
    <button data-eq="3" onclick="switchEq(3)" aria-label="Ampère–Maxwell"><span class="n">IV</span><span class="s">∇×B</span></button>
  </div>
</nav>

<script src="main.js"></script>
</body>
</html>

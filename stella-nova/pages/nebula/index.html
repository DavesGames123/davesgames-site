<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nebula — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   NEBULA  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   One full-window WebGL2 canvas (#gl) inside #viewer. main.js (module)
   loads the shipped volume (data/volume-w.smv) and draws a 5760 px wide
   nebula strip with the star map nebula engine (engine/). Scroll, drag,
   swipe or the arrow keys fly along the strip. saver.js is the screensaver
   hook; it draws #saverCanvas.

   LAYOUT  (# marks an element id main.js binds to)
     #viewer     the canvas host; all scroll and drag input lands here
     #hud        title and #hudLine (palette, nebula code)
     #busy       the bake line: #busyText, #busyBar
     #track      the strip position; press or drag to jump (#trackWin)
     #dock       #btnBack #btnShuffle #btnColours #btnMore
     #tray       the palette swatches (#swatches) and #btnPalDice
     #sheet      quality [data-q], #optTwinkle, #btnLink, #btnReset
     #msg        a message when WebGL2 is missing or the GPU is lost
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="Fly through a simulated star-forming nebula: turbulent gas, ionization fronts, pillars and jets, lit and ray marched in WebGL2. Shuffle a new nebula or relight it in telescope and fantasy palettes.">
<link rel="stylesheet" href="../../lib/sci.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>
<div id="viewer" tabindex="0" role="img" aria-label="A nebula. Scroll, drag or use the arrow keys to fly along it.">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <script type="module" async src="engine/boot-compile.js"></script>
</div>
<canvas id="saverCanvas" hidden aria-hidden="true"></canvas>

<div id="hud">
  <h1>Nebula</h1>
  <div id="hudLine"></div>
</div>

<div id="busy" role="status" hidden><span id="busyText">Loading the nebula</span><i><b id="busyBar"></b></i></div>
<div id="hint">Scroll or drag to fly through the nebula</div>

<div id="tray" hidden>
  <div id="swatches"></div>
  <button type="button" id="btnPalDice" class="dice" aria-label="Random colours">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="15" cy="9" r="1.4"/><circle cx="9" cy="15" r="1.4"/></svg>
    <span>Surprise</span>
  </button>
</div>

<div id="sheet" hidden>
  <div class="sh-h">Quality</div>
  <div class="seg" role="group" aria-label="Quality">
    <button type="button" data-q="fast">Fast</button><button type="button" data-q="balanced">Balanced</button><button type="button" data-q="high">High</button><button type="button" data-q="ultra">Ultra</button>
  </div>
  <label class="tog"><input type="checkbox" id="optTwinkle" checked> Twinkling stars</label>
  <button type="button" class="wide" id="btnLink">Copy a link to this nebula</button>
  <button type="button" class="wide" id="btnReset">Back to the original nebula</button>
  <p class="keys">Keys: <b>S</b> new nebula · <b>C</b> new colours · <b>B</b> back · arrows fly</p>
</div>

<div id="bottom">
  <div id="track" tabindex="0" role="slider" aria-label="Position along the nebula" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30"><span id="trackWin"></span></div>
  <nav id="dock" aria-label="Nebula controls">
    <button type="button" id="btnBack" class="ic" aria-label="Previous look" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button type="button" id="btnShuffle" class="primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      <span>New nebula</span>
    </button>
    <button type="button" id="btnColours" class="ic wide-ic" aria-expanded="false" aria-controls="tray">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.6" class="f"/><circle cx="12" cy="7" r="1.6" class="f"/><circle cx="15.5" cy="10" r="1.6" class="f"/></svg>
      <span>Colours</span>
    </button>
    <button type="button" id="btnMore" class="ic" aria-label="More options" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" class="f"/><circle cx="12" cy="12" r="1.6" class="f"/><circle cx="19" cy="12" r="1.6" class="f"/></svg>
    </button>
  </nav>
</div>

<div id="msg" hidden><p></p></div>
<script type="module" src="main.js"></script>
</body>
</html>

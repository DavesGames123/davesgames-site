<!--
  ═══════════════════════════════════════════════════════════════════════════
   PBF BOUNDARIES  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A position-based fluid whose walls, obstacles and bodies are boundary
   particles (Akinci 2012) that enter the same density sum. The page says
   so on screen: an info band with a lead, six presets with captions (one
   boundary idea each) and a "How it works" sheet with TeX, a colour
   legend, orange dots on every boundary particle, and labels on the
   canvas. It starts on the first preset and keeps running.

   CREDIT. The upstream demo is by Sergii Biloshytskyi (Ukraine), a
   contribution to Ten Minute Physics by Matthias Müller:
   tenMinutePhysics/contribs/PBFBoundary.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of solver.js). The credit bar (kit.js) names both
   authors on the page and on the saver plate.

   OUR ADDITIONS (davesgames.io, not upstream): the water mode, the
   containers, obstacles, emitters, bodies, renderer, GUI and saver.

   FILES
     solver.js   PBF solver, boundary particles, bodies, upstream grains
     render.js   Canvas 2D renderer (vector surface contour)
     budget.js   canvas dpr, surface cell size, particle counts (no DOM)
     main.js     page controller: sim kit GUI, loop, pointer
     saver.js    screensaver shots (sim kit director)
     explain.js  info band, presets, legend, "How it works" (MathJax SVG)
     scene.js    control schema, guard, presets (no DOM)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver director),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'const SCHEMA'  main.js    every control and its random rule
     grep -n 'const SHOTS'   saver.js   the screensaver shots
     grep -n 'const PRESETS' scene.js   the presets and their captions
     grep -n 'const EQS'     explain.js the TeX of "How it works"
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="A position-based fluid whose walls and floating bodies are made of particles too, so the water feels them through one density rule. Presets, labels and the equations explain each boundary idea. After Sergii Biloshytskyi's Ten Minute Physics contribution.">

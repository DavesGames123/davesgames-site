  ═══════════════════════════════════════════════════════════════════════════
   PINBALL  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A pinball table with bumpers, posts and flippers that an autopilot plays, or you do: multiball, pachinko fields and bumper rings. The page starts a random scene on load and keeps it running.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #04.
   Upstream file: tenMinutePhysics/04-pinball.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js, which holds the upstream step).
   Video tutorial: https://youtu.be/NhVUCsXp-Uo

   OUR ADDITIONS (davesgames.io, not upstream): random bumper fields and posts, ball count, launch speeds, table tilt, flipper length and speed, a drain, the autopilot, combos, the renderer, the sim kit GUI and the saver.

   FILES
     sim.js      simulation, schema, guard (no DOM)
     main.js     page controller: sim kit GUI, drawing, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, page2d frame),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  sim.js     controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Station Planner // Stella Nova</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   STATION PLANNER  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup for the grid editor. The scripts fill the palette, the
   inspector and the summary, and draw the station into #cv.

   LOAD ORDER (classic scripts, so the page opens from file://)
     1. gpu-guard.js           shared GPU release hook (always first)
     2. game-data/catalog.js   sets window.SN_DATA (names, sprites, tags)
     3. model.js               module types, layout, rules, enclosure, undo
     4. view.js                camera and canvas drawing
     5. main.js                palette, panels, input, file and share link

   LAYOUT  (# marks an element id)
     ┌──────────────────────────────────────────────────────────────┐
     │ .bar     title · #stationName · undo/redo · share             │
     ├────────────┬──────────────────────────────────┬──────────────┤
     │ #side-l    │ #stage                            │ #side-r       │
     │  #search   │   #cv the edit surface            │  #inspect     │
     │  #palette  │   .tools  .zoom  #layers  #hint   │  #summary     │
     │            │                                   │  .file        │
     └────────────┴──────────────────────────────────┴──────────────┘
     Phone: #side-l and #side-r become bottom sheets; .dock opens them.

   SECTION MAP   (jump with grep -n "<anchor>" index.html)
     top bar ........... class="bar"
     palette ........... id="palette"
     tools ............. class="tools"
     layers ............ id="layers"
     inspector ......... id="inspect"
     summary ........... id="summary"
     file actions ...... class="file"
     phone dock ........ class="dock"
     share dialog ...... id="shareDlg"
  ═══════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><span class="mark">◆</span><span class="t">Station <em>Planner</em></span></div>
    <label class="name"><span>Name</span><input id="stationName" value="New station" spellcheck="false" maxlength="40"></label>
    <div class="bar-act">
      <button class="ib" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="pill" id="bShare"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span>Share link</span></button>
    </div>
  </header>

  <div class="main">
    <!-- Left: the module palette. main.js fills #palette from the catalog. -->
    <aside class="side" id="side-l" aria-label="Modules">
      <div class="grab" data-close="side-l"></div>
      <div class="side-h"><h2>Modules</h2><span class="sub">from the game catalog</span></div>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search modules" autocomplete="off" spellcheck="false"></div>
      <label class="chk"><input type="checkbox" id="showUnlisted"><span>Show modules outside the build palette</span></label>
      <div id="palette"></div>
    </aside>

    <!-- Centre: the edit surface and its floating controls. -->
    <section id="stage">
      <canvas id="cv"></canvas>
      <div class="tools" role="toolbar" aria-label="Tools">
        <button class="tb" data-tool="select" title="Select and move (V)"><svg viewBox="0 0 24 24"><path d="m5 3 14 8-6 2-3 6z"/></svg><span>Select</span></button>
        <button class="tb" data-tool="build" title="Build the picked module (B)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span>Build</span></button>
        <button class="tb" data-tool="erase" title="Erase (X)"><svg viewBox="0 0 24 24"><path d="m7 21-4-4L14 6l6 6-9 9z"/><path d="M7 21h13"/></svg><span>Erase</span></button>
        <button class="tb" data-tool="pan" title="Pan (H or Space)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3m3-3 3 3M12 21l-3-3m3 3 3-3M3 12l3-3m-3 3 3 3M21 12l-3-3m3 3-3 3"/></svg><span>Pan</span></button>
        <span class="tsep"></span>
        <button class="tb" id="bRotate" title="Rotate (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg><span>Rotate</span></button>
        <button class="tb" id="bDelete" title="Delete the selection (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Delete</span></button>
      </div>
      <div class="wallmode" id="wallMode" hidden>
        <button data-wm="line" class="on">Line</button><button data-wm="room">Room</button>
      </div>
      <div class="zoom">
        <button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" title="Fit the station (F)" aria-label="Fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div id="layers" class="layers" aria-label="Layers"></div>
      <div id="hint" class="hint"></div>
      <div id="tip" class="tip" hidden></div>
      <div id="toast" class="toast"></div>
    </section>

    <!-- Right: inspector, station summary, file actions. -->
    <aside class="side" id="side-r" aria-label="Station">
      <div class="grab" data-close="side-r"></div>
      <section class="card" id="inspect"></section>
      <section class="card" id="summary"></section>
      <section class="card layers2-card"><h3>Layers</h3><div id="layers2" class="layers2"></div></section>
      <section class="card file">
        <h3>Layout</h3>
        <div class="btns">
          <button class="btn" id="bShare2">Copy share link</button>
          <button class="btn" id="bExport">Export JSON</button>
          <button class="btn" id="bImport">Import JSON</button>
          <button class="btn" id="bExample">Load example</button>
          <button class="btn warn" id="bClear">Clear</button>
        </div>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
        <p class="fine">Placement checks use the catalog's placement tags. They are a planning aid, not the game's own rule set.</p>
      </section>
    </aside>
  </div>

  <!-- Phone dock: opens the sheets and repeats the main tools. -->
  <nav class="dock" aria-label="Planner dock">
    <button data-sheet="side-l"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Modules</span></button>
    <button data-tool="select"><svg viewBox="0 0 24 24"><path d="m5 3 14 8-6 2-3 6z"/></svg><span>Select</span></button>
    <button data-tool="build"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span>Build</span></button>
    <button data-tool="erase"><svg viewBox="0 0 24 24"><path d="m7 21-4-4L14 6l6 6-9 9z"/><path d="M7 21h13"/></svg><span>Erase</span></button>
    <button data-act="rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg><span>Rotate</span></button>
    <button data-act="undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button>
    <button data-sheet="side-r"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></svg><span>Station</span></button>
  </nav>
  <div class="scrim" id="scrim"></div>
</div>

<div class="dlg" id="shareDlg" hidden>
  <div class="dlg-card">
    <h3>Share this layout</h3>
    <p class="fine">The layout lives in the link itself. Nothing goes to a server.</p>
    <textarea id="shareText" readonly rows="4"></textarea>
    <div class="btns"><button class="btn pri" id="bCopy">Copy</button><button class="btn" id="bCloseDlg">Close</button></div>
  </div>
</div>

<script src="../../lib/game-data/catalog.js"></script>
<script src="model.js"></script>
<script src="view.js"></script>
<script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Platonic Mirrors // Stella Nova</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   PLATONIC MIRRORS  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. A fragment shader ray-marches the polyhedron across the
   full-screen canvas; this file supplies the canvas, the title HUD, and an
   empty control panel that main.js fills at runtime (presets and sections).

   LOAD ORDER
     1. fonts + style.css
     2. main.js (classic script, async IIFE): fetch shaders, build UI, run loop

   LAYOUT  (# marks an element id)
     ┌─────────────────────────────────────────────────────────────┐
     │ .hud  title                                    #stats-hud     │
     │                                                              │
     │        <canvas id=c>   raymarched solid          #toggle ◀   │
     │                                                #panel         │
     │                                                 presets       │
     │                                                 #controls ▶   │
     └─────────────────────────────────────────────────────────────┘
  ═══════════════════════════════════════════════════════════════════════════
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Render surface: main.js sizes it and draws the shader here. -->
<canvas id="c"></canvas>
<!-- Title HUD and the FPS/resolution stats readout, both static shells. -->
<div class="hud"><h1>Platonic Mirrors</h1><div class="sub">Wythoff Construction &middot; Raymarched SDF</div></div>
<div class="stats" id="stats-hud"></div>
<!-- Panel show/hide toggle. -->
<button id="toggle-btn" class="open">◀</button>
<!-- Control panel: presets grid and sliders are built by main.js. -->
<div id="panel">
  <div class="panel-header">
    <h1>PLATONIC MIRRORS</h1>
    <span id="fps">-- fps</span>
  </div>
  <div class="presets" id="presets"></div>
  <div id="controls"></div>
</div>

<script src="main.js"></script>
</body>
</html>

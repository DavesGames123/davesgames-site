<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presence Orbs // Stella Nova</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
   PRESENCE ORBS  ·  page shell
  ────────────────────────────────────────────────────────────────────────────
   Static markup only. main.js builds the WebGPU grid and the frame loop. The
   shaders load from shaders/*.wgsl and the catalog from styles.json. This file
   lays out the sidebar, the tile grid and the inspector modal that main.js
   binds to by id. The shaders derive from the MIT-licensed murmur Metal packs;
   the MIT notice stays in each shaders/*.wgsl header.

   HEAD LOAD ORDER  (order matters)
     1. fonts        Google Fonts stylesheet (absolute)
     2. style.css    the page stylesheet (from the old style block)
     3. main.js      type=module; fetches the packs and styles.json, then boots

   LAYOUT  (the leading hash marks an element id)
     topbar (hidden in the site shell iframe through .in-frame)
     #side    left · state, signal generators, palette, pause
     #stage   scrolling grid of 66 tiles, one WebGPU canvas each
     #modal   inspector: big orb, character knobs, WGSL source
  ════════════════════════════════════════════════════════════════════════════
-->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>if(window!==window.top)document.documentElement.classList.add("in-frame")</script>
<div class="grid-bg"></div>
<div class="topbar">
  <div class="topbar-l"><span class="sys-name">Stella Nova</span><span class="sys-status">Presence Orbs</span></div>
  <div class="topbar-r">SYS // <strong>WGSL SHADER LAB</strong></div>
</div>
<div id="side">
  <div class="side-head"><div class="big" id="state-big">thinking</div><div class="sub">|66 orbs · signal generators⟩</div></div>
  <div class="sec"><div class="sec-lbl">State</div><div class="modes" id="states" role="group" aria-label="State"></div></div>
  <div id="gens"></div>
  <div class="sec"><div class="sec-lbl">Palette</div><div class="swatches">
    <label class="swatch"><span>Tone</span><input type="color" id="tone" value="#5a8cc0"></label>
    <label class="swatch"><span>Tone 2</span><input type="color" id="tone2" value="#5a8cc0"></label>
    <label class="swatch"><span>Ink</span><input type="color" id="inkc" value="#0e1118"></label>
  </div></div>
  <div class="sec"><button class="chip on" id="pause" type="button" aria-pressed="true">▶ animate</button></div>
  <div class="fps" id="fps"></div>
</div>
<div id="nogpu" class="nogpu" hidden>WebGPU is not available in this browser, so the orbs cannot render. Chrome, Edge, and Safari 26 have it on by default; Firefox has it behind <code>dom.webgpu.enabled</code>.</div>
<div id="stage"><div id="table"><div class="cell f-glass" role="button" tabindex="0" id="tile-aura" aria-label="aura: ribbons of colored light swirling slowly inside the glass"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-droplet" aria-label="droplet: the body itself deforms: a zero-g liquid sphere wobbling organically, breathing with voice"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-nebula" aria-label="nebula: volumetric mist folding inside, stirred by thinking"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-prism" aria-label="prism: light entering and softly splitting inside the sphere"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-limn" aria-label="limn: near-dark glass whose edge is alive: a traveling rim of light thickening with voice"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-duet" aria-label="duet: two lights orbiting each other inside: the conversation"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-fathom" aria-label="fathom: layered translucent depths, parallax inside the glass"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-arc" aria-label="arc: one soft bright filament arcing gently within"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-opal" aria-label="opal: internal play-of-color: soft opalescent flashes drifting through"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-glass" role="button" tabindex="0" id="tile-comet" aria-label="comet: a bright point orbiting insi ></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-well" aria-label="well: pulling inward: light and density drawn toward a deep center that never fills"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-tide" aria-label="tide: a slow wash crossing the frame and returning, weight leaning with it"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-undertow" aria-label="undertow: two layers sliding opposite ways, structure born where they shear"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-meander" aria-label="meander: one bright channel wandering through dark mass, the path is the thought"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-confluence" aria-label="confluence: two flows finding each other and joining; joined is the rest state"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-melt" aria-label="melt: a heavy molten mass slowly melting and reforming, viscous, drips absorbed back into the body"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-liquid" role="button" tabindex="0" id="tile-glaze" aria-label="glaze: a thin bright sheet of liquid sliding over a dark form, light traveling in the film"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-bloom" aria-label="bloom: ink meeting water: a front advancing with a live fBm edge, settling saturated"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-marbling" aria-label="marbling: combed ink: layered laminar folds sliding past each other, suminagashi tempo"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-wick" aria-label="wick: ink drawn upward through fiber: capillary creep, gravity in reverse, grain of the paper visible in the climb"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-strata" aria-label="strata: sediment settling into layers: horizontal density bands finding their level"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-halation" aria-label="halation: a dark mass wearing its own light: soft halo shifting as the mass slowly reforms"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-pool" aria-label="pool: ink already at rest, meniscus alive: the stillest style in the set, surface tension doing the thinking"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-feather" aria-label="feather: ink feathering along paper fibers: a directional bleed advancing hair by hair, then resting saturated"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-ink" role="button" tabindex="0" id="tile-palimpsest" aria-label="palimpsest: older writing ghosting up through the surface, almost legible, reabsorbed before it resolves"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-caustic" aria-label="caustic: light refracted through moving water onto a floor: the web, soft, never cellular"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-aurora" aria-label="aurora: a curtain of light folding in slow air, horizontal grammar, nothing falls"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-ember" aria-label="ember: heat above a warm floor: shimmer rising, light pooled low"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-lantern" aria-label="lantern: one light behind moving fog: presence felt through a medium, never seen directly"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-mirage" aria-label="mirage: horizontal refraction bands bending a distant light, the desert-road shimmer"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-oculus" aria-label="oculus: a soft aperture admitting light, opening as thought completes; open is rest"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-dapple" aria-label="dapple: canopy light: soft patches through moving leaves, the shade breathing across the floor"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-light" role="button" tabindex="0" id="tile-eclipse" aria-label="eclipse: a slow occluder drifting across a light, the corona doing the talking at the edge"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-murmuration" aria-label="murmuration: the namesake: a flock as one soft mass, density turning and folding over itself, individuals never resolvable"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-loom" aria-label="loom: threads finding a weave: warp and weft interference resolving into cloth and relaxing again"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-cipher" aria-label="cipher: meaning surfacing: latent structure in a dark field, revealed where a slow attention passes"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-tuning" aria-label="tuning: static finding the station: broadband noise narrowing toward a coherent line; coherent is rest, noise never fully gone"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-current" aria-label="current: signal moving through a medium: impulses traveling a soft network, felt as moving light, never drawn as wires"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-veil" aria-label="veil: layers of translucency sliding: what is behind almost legible, parallax as depth of thought"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-echo" aria-label="echo: a soft form answered by its own fading repetitions, each displaced and softer than the last, never rings"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-signal" role="button" tabindex="0" id="tile-glyph" aria-label="glyph: almost-writing: marks forming out of ink and dissolving before they resolve into letters"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-orb" role="button" tabindex="0" id="tile-breathe" aria-label="breathe: the resting orb: the whole lattice inhaling and exhaling slowly, depth carrying the breath"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-orb" role="button" tabindex="0" id="tile-orbit" aria-label="orbit: latitude bands of dots streaming around the sphere at neighboring speeds"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-orb" role="button" tabindex="0" id="tile-glimmer" aria-label="glimmer: scattered dots catching light in sequence, a constellation being counted"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-orb" role="button" tabindex="0" id="tile-vortex" aria- s="orb-status"></span></div><div class="cell f-presence" role="button" tabindex="0" id="tile-flare" aria-label="flare: a soft solar disc whose edge sprouts short organic licks with voice level; a sun, never an EQ"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-presence" role="button" tabindex="0" id="tile-braid" aria-label="braid: two strands orbiting a common center: loose at idle, braided tight while responding; the conversation itself"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-presence" role="button" tabindex="0" id="tile-mote" aria-label="mote: the minimal presence: one soft light wandering a small path, leaning toward typing, stretching slightly with voice; designed at 18 pt first"><canvas></canvas><span class="orb-status"></span></div><div class="cell f-presence" role="button" tabindex="0" id="tile-ripple" aria-label="ripple: a still face-on liquid disc where input lands: each impulse of activity drops one soft propagating ring"><canvas></canvas><span class="orb-status"></span></div></div></div>

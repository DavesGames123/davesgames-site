<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Retro Shelf · ScummVM player</title>
<!--
  RETRO SHELF · play-scummvm.html — ScummVM player (2026.4.0 web build, GPL-3.0-or-later)
  Runs in the #player iframe of index.html: play-scummvm.html?game=<id>.
  play-scummvm.js writes the unpacked game into the Emscripten FS and then
  loads ../../vendor/scummvm-web@2026.4.0/scummvm.js. SDL draws into #canvas,
  inside the CRT bezel #crt (ScummVM keeps the game aspect itself).
-->
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="stage" id="stage"><div class="crt fill" id="crt"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()" aria-label="Game screen"></canvas><span class="scan" aria-hidden="true"></span><span class="glass" aria-hidden="true"></span></div></div>
<div class="status boot" id="status" role="status" aria-live="polite">
  <div class="boot-head"><span class="boot-mark" aria-hidden="true"></span><span id="statusHead">Retro Shelf · loading</span></div>
  <p class="boot-game" id="statusGame"></p>
  <ol class="boot-log" id="statusLog"></ol>
  <p class="boot-now" id="statusText">Starting ScummVM…</p>
  <div class="boot-bar"><progress id="statusBar" max="1" value="0" hidden></progress><span id="statusPct"></span></div>
  <div class="boot-actions" id="statusActions" hidden><button type="button" id="retryBtn">Try again</button><button type="button" id="quitBtn">Exit</button></div>
</div>
<div class="keys" id="keys" hidden aria-label="Game keys">
  <button type="button" data-code="Escape" data-key="Escape">Esc · skip</button>
  <button type="button" data-code="F5" data-key="F5">F5 · menu</button>
  <button type="button" data-code="Space" data-key=" ">Space · pause</button>
</div>
<script type="module" src="play-scummvm.js"></script>
</body>
</html>

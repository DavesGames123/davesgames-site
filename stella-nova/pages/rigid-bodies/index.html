<!--
  ═══════════════════════════════════════════════════════════════════════════
   RIGID BODIES  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   XPBD rigid bodies on distance constraints: a crib mobile, a mass
   chain, a pendulum wave, a chandelier, a rope bridge, a net and a
   wrecking ball. The page starts a random scene on load and keeps it
   running. Drag a body to pull it; let go fast to throw it.

   CREDIT. The upstream demo is Ten Minute Physics #22 by Matthias Müller:
   tenMinutePhysics/22-rigidBodies.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js). The credit bar (kit.js) names the author on
   the page and the saver plate.

   OUR ADDITIONS (davesgames.io, not upstream): the scene parameters, the
   five new scenes, wind and gusts, the look, the GUI and the saver.

   FILES
     sim.js      the upstream classes (bodies, constraints, simulator,
                 labels), with site changes marked "site:"
     scenes.js   scene builders, schema, random rules, guard
     app.js      page controller: kit, stage, recolour, drag, loop
     saver.js    screensaver shots (sim kit director)
     main.js     credit record + start()
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, 3D stage),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scenes.js  controls and random rules
     grep -n 'export const SHOTS'          saver.js   the screensaver shots
     grep -n 'export class RigidBody'      sim.js     the upstream body
  ═══════════════════════════════════════════════════════════════════════════
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SDF Forge — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   SDF FORGE  ·  page shell  (nav key: sdf-lab)
  ───────────────────────────────────────────────────────────────────────────
   A signed distance field modeller with the interface of Forge, the 3ds Max
   style modeller in Warp. The document is a tree of SDF nodes: primitives,
   boolean groups and per-node modifier stacks. codegen compiles it to WGSL;
   a parameter edit writes a buffer and the shader stays, a structure edit
   rebuilds the shader. The sphere tracing lab lives on as the SLICE pane.

   Static markup only. main.js builds the panels and runs WebGPU.

   LAYOUT  (# marks an element id the modules bind to)
     #viewport   the panes; each .pane holds a WebGPU canvas, an overlay
                 canvas and a label (view and shading menus)
     #bar        OBJECTS, SELECTION on the left; CREATE, MODIFY, VIEW, SCENE
                 and undo / redo on the right (Forge's top bar)
     #leftCol    the OBJECTS and SELECTION panels (they follow the scene)
     #rightCol   the CREATE, MODIFY, VIEW and SCENE panels (tools)
     #status     GRID readout, tool chips Q W E R, WORLD / LOCAL, SNAP, hint
     phone ..... (max-width 768px, or a short landscape touch screen)
                 #dock at the base: panels, pane switcher, tools, undo.
                 portrait: the panels move into #sheet, a bottom sheet;
                 landscape: #sheet is a drawer at the right edge.

   MODULES  (js/, each with its own grep map)
     math.js      vectors, matrices, Euler      doc.js       the document
     history.js   undo and redo                 codegen.js   WGSL, GLSL, JS
     field.js     the CPU field, probe march    shader.js    the fixed WGSL
     render.js    WebGPU                        camera.js    cameras
     panes.js     the viewport layout           gizmo.js     move rotate scale
     viewcube.js  the view cube                 overlay.js   2D overlays
     ui.js        the panels                    input.js     pointer, keys, create
     files.js     save, load, export            examples.js  example scenes
     mc.js        marching cubes                mc-worker.js the OBJ worker
     main.js      the app state and the frame loop
     equations.js static MathJax SVG (typeset.mjs writes it)

   Credits: distance functions and the smooth minimum after Inigo Quilez;
   sphere tracing after Hart 1996; over-relaxed tracing after Keinert et al.
   2014; marching cubes after Lorensen and Cline 1987. All code original.
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="SDF Forge: model with signed distance fields in a 3ds Max style editor. Primitives, smooth booleans, modifier stacks, quad view, gizmos, WGSL and GLSL export, OBJ by marching cubes, and the sphere tracing slice view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>

<main id="viewport" aria-label="Viewports"></main>

<header id="bar">
  <div class="bar-l">
    <button type="button" class="tab" data-panel="objects">OBJECTS</button>
    <button type="button" class="tab" data-panel="selection">SELECTION</button>
  </div>
  <div class="bar-r">
    <button type="button" class="ico" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button type="button" class="ico" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button type="button" class="tab" data-panel="create">CREATE</button>
    <button type="button" class="tab" data-panel="modify">MODIFY</button>
    <button type="button" class="tab" data-panel="view">VIEW</button>
    <button type="button" class="tab" data-panel="scene">SCENE</button>
  </div>
</header>

<div id="leftCol" class="col"></div>
<div id="rightCol" class="col"></div>

<div id="status">
  <span id="gridTag" class="tag">GRID 1.000</span>
  <span class="seg" id="tools">
    <button type="button" data-tool="select" title="Select (Q)">Q<span>SELECT</span></button>
    <button type="button" data-tool="move" title="Move (W)">W<span>MOVE</span></button>
    <button type="button" data-tool="rotate" title="Rotate (E)">E<span>ROTATE</span></button>
    <button type="button" data-tool="scale" title="Scale (R)">R<span>SCALE</span></button>
  </span>
  <button type="button" id="coordBtn" class="chip" title="Gizmo axes">WORLD</button>
  <button type="button" id="snapBtn" class="chip" title="Snap (S)">SNAP</button>
  <span id="hint"></span>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="nogpu" hidden>WebGPU is not available in this browser, so SDF Forge cannot render. Chrome, Edge and Safari 26 have it on by default; Firefox has it behind <code>dom.webgpu.enabled</code>.</div>

<nav id="dock" aria-label="Quick controls">
  <button type="button" id="dockSheet" aria-label="Panels" aria-expanded="false">&#9776;</button>
  <div class="seg" id="dockPanes"></div>
  <button type="button" id="dockUndo" class="ico" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
</nav>
<aside id="sheet" aria-label="Panels">
  <div id="sheetGrip" role="button" aria-label="Resize panels"><span></span></div>
  <div id="sheetTabs"></div>
  <button type="button" id="sheetClose" aria-label="Close panels">&#x2715;</button>
  <div id="sheetBody"></div>
</aside>

<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>

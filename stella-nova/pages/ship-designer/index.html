<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Ship Designer // Stella Nova</title>
<!--
  ===========================================================================
   SHIP DESIGNER  ·  page shell
  ---------------------------------------------------------------------------
   The livery painter. main.js loads the three ship-livery layers (hull,
   cockpit, accents) and their tint masks from media/sprites/ship-livery/.
   It paints the layers with three colours and shows the result in the hero
   card and in a fleet of ships that fly on a 2D canvas.

   LAYOUT
     desktop (> 900 px)  .stage (hero card, fleet card)  |  #panel (tabs)
     phone   (<= 900 px) .stage in one column; #panel is a bottom sheet with
                         a grip. A tap on a tab opens the sheet.

   SECTION MAP   (jump with grep -n "<anchor>" index.html)
     header actions ..... id="btnPng"        PNG export, copy link
     hero preview ....... id="shipCanvas"    the painted ship, 512 x 512
     fleet canvas ....... id="fleetCanvas"   the flying fleet
     fleet head ......... id="fleetMode"     wander / formation, pause
     control panel ...... id="panel"         tabs, grip on phones
     livery presets ..... id="presetGrid"    filled by buildPresets()
     paint tab .......... id="channels"      hull / trim / accent picker
     trim pattern ....... id="trimSeg"       where the trim colour goes
     fleet tab .......... id="shipCount"     count, size, speed, trails
  ===========================================================================
-->
<link href="../../vendor/fonts/space-grotesk+ibm-plex-mono+instrument-serif.4efc8126.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="kicker">Stella Nova · Shipyard</div>
    <h1>Ship <em>Designer</em></h1>
  </div>
  <div class="actions">
    <button class="btn ghost" id="btnLink" type="button" aria-label="Copy a link to this livery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Copy link</span>
    </button>
    <button class="btn gold" id="btnPng" type="button" aria-label="Download the painted ship as PNG">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Export PNG</span>
    </button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <!-- Hero preview. paint() draws the full-size ship here. -->
    <div class="card hero" id="hero">
      <div class="hero-glow" id="heroGlow"></div>
      <canvas id="shipCanvas" width="512" height="512" aria-label="Painted ship preview"></canvas>
      <div class="hero-meta">
        <div>
          <div class="label">Livery</div>
          <div class="livery-name" id="liveryName">Custom</div>
        </div>
        <div class="hero-chips" id="heroChips"></div>
      </div>
      <div class="credit">Ship art by Nisha Sposato</div>
    </div>

    <!-- Fleet. fleet.frame() draws the ships here while the card is on screen. -->
    <div class="card fleet">
      <div class="card-head">
        <h2>Fleet</h2>
        <div class="seg" id="fleetMode" role="group" aria-label="Flight mode">
          <button type="button" data-mode="wander" class="on">Wander</button>
          <button type="button" data-mode="formation">Formation</button>
        </div>
        <button class="chip-btn" id="btnPause" type="button" aria-pressed="false">Pause</button>
      </div>
      <div class="fleet-wrap" id="fleetWrap"><canvas id="fleetCanvas" aria-label="Fleet flying with this livery"></canvas></div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Livery controls">
    <div class="grip" id="grip" role="button" tabindex="0" aria-label="Open or close the controls"><span></span></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="liveries" class="on">Liveries</button>
      <button type="button" role="tab" data-tab="paint">Paint</button>
      <button type="button" role="tab" data-tab="fleet">Fleet</button>
    </nav>

    <div class="tab-body" data-body="liveries">
      <div class="preset-grid" id="presetGrid"></div>
    </div>

    <div class="tab-body" data-body="paint" hidden>
      <div class="channels" id="channels" role="radiogroup" aria-label="Colour to edit">
        <button type="button" data-ch="hull" class="on"><i></i><span>Hull</span></button>
        <button type="button" data-ch="trim"><i></i><span>Trim</span></button>
        <button type="button" data-ch="accent"><i></i><span>Accent</span></button>
      </div>
      <div class="picker" id="picker">
        <div class="sv" id="sv"><i class="knob"></i></div>
        <div class="hue" id="hue"><i class="knob"></i></div>
        <div class="hexrow">
          <span class="swatch" id="curSwatch"></span>
          <label class="hex"><span>HEX</span><input id="hexInput" type="text" maxlength="7" spellcheck="false" autocomplete="off" inputmode="text"></label>
        </div>
        <div class="quick" id="quick"></div>
      </div>
      <div class="field-label">Trim pattern</div>
      <div class="seg wrap" id="trimSeg" role="group" aria-label="Trim pattern"></div>
      <div class="row-btns">
        <button class="chip-btn" id="btnSwap" type="button">Swap hull and accent</button>
        <button class="chip-btn" id="btnRandom" type="button">Random</button>
      </div>
    </div>

    <div class="tab-body" data-body="fleet" hidden>
      <label class="slider"><span>Ships <b id="shipCountVal">24</b></span><input type="range" id="shipCount" min="4" max="40" step="1" value="24"></label>
      <label class="slider"><span>Ship size <b id="shipSizeVal">44 px</b></span><input type="range" id="shipSize" min="24" max="80" step="2" value="44"></label>
      <label class="slider"><span>Speed <b id="shipSpeedVal">1.0x</b></span><input type="range" id="shipSpeed" min="0.2" max="2" step="0.1" value="1"></label>
      <label class="toggle"><input type="checkbox" id="trails" checked><span>Engine glow</span></label>
      <p class="hint">Drag on the fleet to push the ships. On a phone held sideways, drag across the fleet; an up or down drag scrolls the page. The fleet stops when it is off screen.</p>
    </div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../lib/game-data/catalog.js"></script>
<script src="main.js"></script>
</body>
</html>

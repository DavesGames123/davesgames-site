<!--
  ═══════════════════════════════════════════════════════════════════════════
   SOFT BODIES  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Tetrahedral soft bodies simulated with XPBD edge and volume constraints. Squash them, throw them and add more bunnies.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #10.
   Upstream file: tenMinutePhysics/10-softBodies.html in
   https://github.com/matthias-research/pages (MIT License (notice kept above)).
   Video tutorial: https://youtu.be/uCaHXkS2cUg

   The upstream demo is split into the page with no change to its code:
   style.css holds its <style> block, main.js its inline script, one
   shared global scope. CDN libraries load from vendor/. Its buttons and
   slider stay in the hidden block #tmp-ui, so the upstream script still
   finds them; the sim kit GUI replaces them on screen.

   OUR ADDITIONS (davesgames.io, not upstream):
     sim.js       the site layer: credit, sim kit GUI, scenes, saver shots
     scene.js     controls, stability guard, scene build (no DOM)
     stage3d.js   shared with the other three.js ports: look, obstacles,
                  camera rig, frame loop
     page3d.js    shared: the sim kit controller and the saver director
     tests.mjs    node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver director),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scene.js   every control
     grep -n 'const SHOTS'                 sim.js     the saver shots
     grep -n 'export function install'     stage3d.js the frame loop
  ═══════════════════════════════════════════════════════════════════════════
-->

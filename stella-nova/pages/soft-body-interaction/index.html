   Pick up and throw a simulated object with the mouse: how to add user interaction to a 3D physics simulation.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #08.

   The upstream demo is split into the page with no change to its code:
   style.css holds its <style> block, main.js its inline script, one
   shared global scope. CDN libraries load from vendor/. Its buttons and
   inputs stay in the hidden block #tmp-ui, so the upstream script still
   finds them; the sim kit GUI replaces them on screen.

   OUR ADDITIONS (davesgames.io, not upstream):
     sim.js       the site layer: credit, sim kit GUI, look, actions
     scene.js     controls, stability guard, scene build (no DOM)
     shots.js     the screensaver shots (no DOM)
     tests.mjs    node tests (no browser)
   Shared: ../soft-bodies/stage3d.js (look, obstacles, camera rig, frame
           loop), ../soft-bodies/page3d.js (sim kit controller, saver
           director), ../../widgets/sim-kit/ (GUI, randomizer, saver),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scene.js   every control
     grep -n 'export function makeShots'   shots.js   the saver shots
  ═══════════════════════════════════════════════════════════════════════════

<!--
  ═══════════════════════════════════════════════════════════════════════════
   SPATIAL HASHING  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Thousands of colliding balls in a box; a spatial hash finds each
   ball's neighbours. The page starts a random scene on load and keeps it
   running. Drag the glass sphere to stir the balls.

   CREDIT. The upstream demo is Ten Minute Physics #11 by Matthias Müller:
   tenMinutePhysics/11-hashing.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js). Video: https://youtu.be/D2M8jTtKi44. The
   credit bar (kit.js) names the author on the page and the saver plate.

   OUR ADDITIONS (davesgames.io, not upstream): restitution, gravity and
   tilt, the box size, the starts, the stirrer, the probe query view, the
   pair counter, the look, the GUI and the saver.

   FILES
     sim.js      the upstream Hash class, helpers and ball loop + ours
     scene.js    schema, random rules, guard (no DOM)
     app.js      page controller: kit, stage, instanced balls, HUD
     saver.js    screensaver shots (sim kit director)
     main.js     credit record + start()
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, 3D stage),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  scene.js   controls and random rules
     grep -n 'export const SHOTS'          saver.js   the screensaver shots
     grep -n 'export class Hash'           sim.js     the upstream hash
  ═══════════════════════════════════════════════════════════════════════════
-->

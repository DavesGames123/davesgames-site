<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<script src="../../lib/wishlist.js"></script>
<script src="../../lib/stats-beacon.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tidal Currents — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   TIDAL CURRENTS  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   One week of surface currents from NOAA operational forecast models, in
   many places. Fine particle trails follow the current. Color shows the
   water temperature. Brightness shows the speed.

   The map fills the whole window at every aspect. There is no letterbox,
   no zoom, no pan and no scroll. view.js picks the part of the extent
   raster that the window shows. The text has the look of the shell
   screensaver plate (lib/screensaver.js): a centred head at the top and a
   centred foot at the base, over a dark veil. In saver mode the page hides
   its head, foot and labels, and the shell plate is the only text.

   HEAD LOAD ORDER
     1. style.css    the page stylesheet
     2. sci.css      STIX Two Text and Inter. It loads the fonts.
     3. nav-data.js, screensaver-catalog.js   the page number and the
                     section colour for the head, in the same order as the
                     saver plate

   FILES
     main.js      head, foot, labels, clock, controls, atlas, about sheet
     view.js      extent / core / view math (no DOM)
     locator.js   the small locator globe (2D canvas), in the about sheet
     quality.js   frame-rate governor: particle share, then render scale
     engine.js    WebGPU particles, glow and composite (no DOM text)
     colormap.js  the temperature ramp; engine and foot use the same ramp
     shaders/     WGSL programs that engine.js fetches at run time
     data/<id>/   meta.json, mask.png, field PNGs and thumb for each location
     data/index.json  the location list, in atlas order
     data/world.json  Natural Earth land and lakes for the locator

   LAYOUT  (# marks an element id main.js binds to)
     ┌──────────────────────────── #stage ─────────────────────────────────┐
     │ #map      WebGPU canvas, the whole window                           │
     │ #veil     dark bands behind the head and the foot                   │
     │ #overlay  place labels                                              │
     │ #head     No. · section  /  location title  /  rule  /  model       │
     │ #foot     #params  /  #notes  /  #scrub (the week)  /  #controls    │
     │           #controls = ‹  [ location ]  ›  play  i                   │
     │ #fade  #loading  #fallback                                          │
     ├─────────────────────────────────────────────────────────────────────┤
     │ #atlas    location menu: a drawer on the right, a sheet on a phone  │
     │ #caption  about sheet with the locator globe; same placement        │
     └─────────────────────────────────────────────────────────────────────┘

   GREP MAP  (main.js)
     grep -n 'function relayout'      view, canvas size, labels
     grep -n 'function buildOverlay'  head, foot and place labels
     grep -n 'function placeLabels'   labels from lon/lat, collisions
     grep -n 'function buildAtlas'    the location menu
     grep -n 'function switchTo'      crossfade and dataset load
     grep -n 'function frame'         clock and render loop
     grep -n 'function pageMark'      page number and section colour
     grep -n 'const CAPTIONS'         fallback captions (meta.blurb wins)
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="A week of tidal currents in many places, drawn as fine glowing particle trails over NOAA model data. Color is water temperature and brightness is speed.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../lib/sci.css">
<script src="../../lib/nav-data.js"></script>
<script src="../../lib/screensaver-catalog.js"></script>
</head>
<body>
<main id="stage">
  <canvas id="map" aria-label="Animated map of surface currents"></canvas>
  <div id="veil"></div>
  <div id="overlay"></div>
  <header id="head">
    <div id="cat"></div>
    <h1 id="ttl"></h1>
    <i class="rule"></i>
    <div id="sub"></div>
  </header>
  <footer id="foot">
    <div id="params"></div>
    <div id="notes"></div>
    <div id="scrub" role="slider" aria-label="Time in the week" aria-valuemin="0"><i class="fill"></i><i class="knob"></i></div>
    <nav id="controls" aria-label="Location">
      <button id="prev" type="button" aria-label="Previous location" title="Previous location (Left)">‹</button>
      <button id="where" type="button" aria-haspopup="dialog" aria-expanded="false" title="All locations (M)">
        <span class="br">[</span><span id="locName"></span><span id="locCount"></span><span class="br">]</span>
      </button>
      <button id="next" type="button" aria-label="Next location" title="Next location (Right)">›</button>
      <span class="sep"></span>
      <button id="play" type="button" aria-label="Pause" title="Play / pause (Space)"></button>
      <button id="info" type="button" aria-label="About this map" aria-pressed="false" title="About this map (I)">i</button>
    </nav>
  </footer>
  <div id="fade"></div>
  <div id="loading" hidden><span></span>Loading</div>
  <div id="fallback" hidden></div>
</main>

<div id="scrim" hidden></div>

<aside id="caption" class="sheet" hidden aria-live="polite">
  <div id="capGrip" class="grip" aria-hidden="true"></div>
  <button id="capClose" class="close" type="button" aria-label="Close about">×</button>
  <h2 id="capTitle"></h2>
  <div id="capGlobe"><canvas id="globe" role="img" aria-label="Locator globe"></canvas></div>
  <div id="capBody"></div>
</aside>

<aside id="atlas" class="sheet" hidden aria-label="Locations">
  <div id="atlasGrip" class="grip" aria-hidden="true"></div>
  <header>
    <h2>Atlas</h2>
    <span id="atlasCount"></span>
    <button id="atlasClose" class="close" type="button" aria-label="Close atlas">×</button>
  </header>
  <div id="atlasBody"></div>
</aside>

<script type="module" src="main.js"></script>
</body>
</html>

  ═══════════════════════════════════════════════════════════════════════════
   TRIPLE PENDULUM  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A triple pendulum by position based dynamics next to the analytic Lagrange solution, with the six upstream presets, random chains and a second copy a hair apart. The page starts a random scene on load and keeps it running.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #06.
   Upstream file: tenMinutePhysics/06-pendulum.html in
   https://github.com/matthias-research/pages (MIT License; the notice is
   kept at the top of sim.js, which holds the upstream step).
   Video tutorial: https://youtu.be/XPZEeS70zzU

   OUR ADDITIONS (davesgames.io, not upstream): random chains and starts, the second copy, gravity and time scale, dragging, the renderer, the sim kit GUI and the saver.

   FILES
     sim.js      simulation, schema, guard (no DOM)
     main.js     page controller: sim kit GUI, drawing, pointer
     saver.js    screensaver shots (sim kit director)
     tests.mjs   node tests (no browser)
   Shared: ../../widgets/sim-kit/ (GUI, randomizer, saver, page2d frame),
           ../../widgets/ten-minute-physics/kit.js (credit bar).

   GREP MAP
     grep -n 'export function makeSchema'  sim.js     controls and random rules
     grep -n 'const SHOTS'                 saver.js   the screensaver shots
  ═══════════════════════════════════════════════════════════════════════════
-->

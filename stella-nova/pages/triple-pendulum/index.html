<!--
  ═══════════════════════════════════════════════════════════════════════════
   TRIPLE PENDULUM  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   A chaotic multi-link pendulum simulated with position based dynamics and substeps, compared with the analytic double pendulum.

   CREDIT. The simulation is by Matthias Müller, Ten Minute Physics #06.
   Upstream file: tenMinutePhysics/06-pendulum.html in
   https://github.com/matthias-research/pages (MIT License (notice kept above)).
   Video tutorial: https://youtu.be/XPZEeS70zzU

   The upstream demo is split into the page pad with no change to its
   code: style.css holds its <style> blocks, main.js (and script-N.js)
   its inline scripts in order, one shared global scope. CDN libraries
   load from vendor/. The site adds only these files:
     ../../widgets/ten-minute-physics/kit.js   credit bar + saver director
     saver.js                                  TMP.page credit + snSaver shots

   GREP MAP
     grep -n 'TMP.page'    saver.js   the credit record
     grep -n 'shots:'      saver.js   the screensaver shot list
     grep -n 'fit('        saver.js   how the sim is resized for the saver
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="A chaotic multi-link pendulum simulated with position based dynamics and substeps, compared with the analytic double pendulum. By Matthias Müller, Ten Minute Physics.">

	<canvas id = "myCanvas"></canvas>
 
<script src="main.js"></script>
<script src="saver.js"></script>
</body>

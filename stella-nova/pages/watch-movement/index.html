<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Watch Movement — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   WATCH MOVEMENT  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. Several watch movements in 3D that run and come
   apart in an exploded view. calibres/*.js hold each mechanism (no DOM,
   no THREE; tests.mjs runs them in Node). scenes/*.js build each one in
   three.js with kit.js. main.js runs the stage, the picker and the cards.

   HEAD LOAD ORDER
     1. lib/gpu-guard.js  releases the WebGL context when the shell swaps
     2. fonts, style.css
     3. importmap for three r160, then main.js as a module

   LAYOUT  (# marks an element id main.js binds to)
     desktop ... #panel at the left, #view fills the rest. #read is the
                 clock, top left of the view. #tipHover follows the mouse
                 over a part; #tipPin is pinned to a part by a click, with
                 the #leader line. #labels holds part labels.
     phone ..... (max-width 768px, or a short landscape touch screen)
                 #dock at the base: panel, explode, play, next movement,
                 time rate. portrait: #panel is a bottom sheet;
                 landscape: a drawer. A tap pins a card above the dock.

   GREP MAP  (main.js)
     grep -n 'function swapTo'       build a calibre and cross-fade to it
     grep -n 'function cardHTML'     the part card
     grep -n 'function placePinned'  the pinned card and its leader
     grep -n 'const VIEWS'           camera presets
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="Watch movements in 3D: a Swiss lever, a tourbillon, an automatic and an 18th-century verge fusee. Every gear meshes and turns at its true rate, and each calibre comes apart in an exploded view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Stella Nova</div>
  <div class="pagetitle">Watch Movement</div>
  <button id="gear" type="button" aria-label="Open controls">☰ Controls</button>
</div>

<main id="stage">
  <canvas id="view"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <svg id="leader" aria-hidden="true"><line/><circle class="pulse" r="6"/><circle class="dotA" r="3"/></svg>
  <div id="read" class="pread"></div>
  <div id="hint" class="phint">hover a part to name it · click to pin its card · drag to orbit</div>
  <div class="tip" id="tipHover" aria-live="polite"><div class="tip-in"></div></div>
  <div class="tip pinned" id="tipPin" aria-live="polite"><button id="tipPinClose" type="button" aria-label="Unpin">✕</button><div class="tip-in"></div></div>
</main>
<div id="nogl" hidden>WebGL is not available in this browser, so the movement cannot render.</div>

<aside id="panel" class="open" aria-label="Controls">
  <div id="sheetGrip" role="button" aria-label="Resize controls"><span></span></div>
  <button id="panelClose" type="button" aria-label="Close controls">✕</button>

  <div class="sec-label first">Movement</div>
  <div id="movements"></div>

  <div id="calInfo">
    <h1 id="calTitle">Watch movement</h1>
    <div class="kind" id="calKind"></div>
    <p class="lede" id="calLede"></p>
  </div>

  <div class="sec-label">View</div>
  <div class="grid2" id="views">
    <button data-view="front" type="button">Movement side</button>
    <button data-view="dial" type="button">Dial side</button>
    <button data-view="exploded" type="button">Exploded</button>
    <button data-view="escapement" type="button">Escapement</button>
  </div>

  <div class="sec-label">Explode</div>
  <div class="row"><label for="explode">Spread</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0.55"><span class="val" id="explodeV"></span></div>
  <div class="toggles">
    <button class="tog" id="assemble" type="button">Assemble</button>
    <button class="tog" id="burst" type="button">Explode</button>
  </div>

  <div class="sec-label">Time</div>
  <div class="grid3" id="rates">
    <button data-rate="0" type="button">❚❚ Pause</button>
    <button data-rate="0.05" type="button">1/20×</button>
    <button data-rate="0.25" type="button">1/4×</button>
    <button data-rate="1" type="button">1× real</button>
    <button data-rate="60" type="button">60×</button>
    <button data-rate="3600" type="button">3600×</button>
  </div>
  <p class="note" id="rateNote"></p>

  <div class="sec-label">Mainspring</div>
  <div class="reserve"><div class="bar"><i id="resBar"></i></div><span id="resV"></span></div>
  <button class="tog wide" id="wind" type="button">Hold to wind</button>

  <div class="sec-label">Show</div>
  <div class="grid2">
    <button class="tog on" id="tDial" type="button">Dial &amp; hands</button>
    <button class="tog on" id="tBridges" type="button">Bridges</button>
    <button class="tog on" id="tLabels" type="button">Labels</button>
    <button class="tog on" id="tOrbit" type="button">Gentle orbit</button>
  </div>

  <div class="sec-label">Going train</div>
  <table class="readout" id="train"></table>
  <p class="note" id="trainNote"></p>

  <div class="sec-label">How it works</div>
  <div class="about" id="about"></div>
</aside>

<nav id="dock" aria-label="Quick controls">
  <button id="dockPanel" type="button" aria-label="Controls" aria-expanded="false">☰</button>
  <button id="dockMove" type="button" aria-label="Next movement">◎</button>
  <button id="dockExplode" type="button" aria-label="Explode">◇</button>
  <button id="dockPlay" type="button" aria-label="Pause">❚❚</button>
  <div class="seg" id="dockRates">
    <button data-rate="0.05" type="button">1/20×</button>
    <button data-rate="1" type="button">1×</button>
    <button data-rate="60" type="button">60×</button>
    <button data-rate="3600" type="button">3600×</button>
  </div>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>

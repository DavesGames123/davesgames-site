<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../lib/gpu-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Timepiece Randomizer — Stella Nova · davesgames.io</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   TIMEPIECE RANDOMIZER  ·  page shell
  ───────────────────────────────────────────────────────────────────────────
   Static markup only. Each roll makes a pocket watch, a wristwatch, a wall
   clock or a twin-bell alarm clock round one of the four working movements
   of ../watch-movement, with a random finish, face and case. generator.js
   turns a seed into the spec (no DOM; tests.mjs runs it); cases.js builds
   the case; main.js runs the page on ../watch-movement's stage and cards.

   HEAD LOAD ORDER
     1. lib/gpu-guard.js
     2. fonts, ../watch-movement/style.css (the shared shell), style.css
     3. importmap for three r160, then main.js as a module

   LAYOUT  (# marks an element id main.js binds to)
     desktop ... #panel at the left with five groups: Options (#roll, the
                 type chips and the locks), Spec (#specRows), View, Time,
                 Show. #view fills the rest; #tipHover and #tipPin are the
                 part cards, #leader the pin line.
     phone ..... #dock: Roll (rolls at once), then tabs for Options, Spec,
                 View and Time, and play. A tab opens a short sheet with
                 its group only.

   GREP MAP  (main.js)
     grep -n 'function roll'      make a spec and swap to it
     grep -n 'function sceneOpts' the movement scene options for a spec
     grep -n 'function fillSpec'  the Spec rows
     grep -n 'const VIEWS'        camera presets
  ═══════════════════════════════════════════════════════════════════════════
-->
<meta name="description" content="Roll a random timepiece: a pocket watch, wristwatch, wall clock or twin-bell alarm clock, built round a real working movement with a random finish, dial and case.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../watch-movement/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>if(window!==window.top)document.documentElement.classList.add('in-frame')</script>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Stella Nova</div>
  <div class="pagetitle">Timepiece Randomizer</div>
  <button id="gear" type="button" aria-label="Open controls">☰ Controls</button>
</div>

<main id="stage">
  <canvas id="view"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <svg id="leader" aria-hidden="true"><line/><circle class="pulse" r="6"/><circle class="dotA" r="3"/></svg>
  <div id="read" class="pread"></div>
  <div id="hint" class="phint">hover a part to name it · click to pin its card · drag to orbit</div>
  <button id="bigRoll" type="button" aria-label="Roll a new timepiece"><i>⚄</i><span>Roll</span></button>
  <div class="tip" id="tipHover" aria-live="polite"><div class="tip-in"></div></div>
  <div class="tip pinned" id="tipPin" aria-live="polite"><button id="tipPinClose" type="button" aria-label="Unpin">✕</button><div class="tip-in"></div></div>
</main>
<div id="nogl" hidden>WebGL is not available in this browser, so the timepiece cannot render.</div>

<aside id="panel" class="open" aria-label="Controls">
  <div id="sheetGrip" role="button" aria-label="Resize controls"><span></span></div>
  <button id="panelClose" type="button" aria-label="Close controls">✕</button>

  <section class="grp" data-grp="roll">
    <div class="sec-label first">Timepiece</div>
    <div id="calInfo">
      <h1 id="title">Timepiece</h1>
      <div class="kind" id="kind"></div>
    </div>
    <button class="roll" id="roll" type="button"><i>⚄</i> Roll a new one</button>
    <div class="sec-label">Type</div>
    <div class="chips" id="types">
      <button data-type="" type="button" class="on">Any</button>
      <button data-type="pocket" type="button">Pocket</button>
      <button data-type="wrist" type="button">Wrist</button>
      <button data-type="wall" type="button">Wall</button>
      <button data-type="alarm" type="button">Alarm</button>
    </div>
    <div class="sec-label">Keep when rolling</div>
    <div class="grid3" id="locks">
      <button class="tog" data-keep="movement" type="button">Movement</button>
      <button class="tog" data-keep="face" type="button">Face</button>
      <button class="tog" data-keep="case" type="button">Case</button>
    </div>
    <div class="seed"><span>Seed</span><code id="seed"></code><button id="copy" type="button">Copy link</button></div>
  </section>

  <section class="grp" data-grp="spec">
    <div class="sec-label">Spec</div>
    <table class="readout spec" id="specRows"></table>
    <p class="note"><a id="moveLink" href="../watch-movement/index.html" target="_top">See this movement explained →</a></p>
  </section>

  <section class="grp" data-grp="view">
    <div class="sec-label">View</div>
    <div class="grid2" id="views">
      <button data-view="dial" type="button">Dial side</button>
      <button data-view="back" type="button">Movement side</button>
      <button data-view="side" type="button">Side</button>
      <button data-view="exploded" type="button">Exploded</button>
    </div>
    <div class="sec-label">Explode</div>
    <div class="row"><label for="explode">Spread</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0"><span class="val" id="explodeV"></span></div>
    <div class="sec-label">Show</div>
    <div class="grid2">
      <button class="tog on" id="tCase" type="button">Case</button>
      <button class="tog on" id="tDial" type="button">Dial &amp; hands</button>
      <button class="tog" id="tLabels" type="button">Labels</button>
      <button class="tog on" id="tOrbit" type="button">Gentle orbit</button>
    </div>
  </section>

  <section class="grp" data-grp="time">
    <div class="sec-label">Time</div>
    <div class="grid3" id="rates">
      <button data-rate="0" type="button">❚❚ Pause</button>
      <button data-rate="0.05" type="button">1/20×</button>
      <button data-rate="0.25" type="button">1/4×</button>
      <button data-rate="1" type="button">1× real</button>
      <button data-rate="60" type="button">60×</button>
      <button data-rate="3600" type="button">3600×</button>
    </div>
    <div class="sec-label">Mainspring</div>
    <div class="reserve"><div class="bar"><i id="resBar"></i></div><span id="resV"></span></div>
    <button class="tog wide" id="wind" type="button">Hold to wind</button>
    <div class="grid2 extras">
      <button class="tog" id="tLid" type="button" hidden>Open lid</button>
      <button class="tog" id="tBack" type="button" hidden>Open back</button>
      <button class="tog" id="tRing" type="button" hidden>Ring alarm</button>
      <button class="tog on" id="tWrist" type="button" hidden>Wrist motion</button>
    </div>
  </section>
</aside>

<nav id="dock" aria-label="Controls">
  <button id="dockRoll" type="button" aria-label="Roll a new timepiece"><i>⚄</i><span>Roll</span></button>
  <button class="tab" data-grp="roll" type="button"><i>☰</i><span>Options</span></button>
  <button class="tab" data-grp="spec" type="button"><i>ℹ</i><span>Spec</span></button>
  <button class="tab" data-grp="view" type="button"><i>◈</i><span>View</span></button>
  <button class="tab" data-grp="time" type="button"><i>◷</i><span>Time</span></button>
  <button id="dockPlay" type="button" aria-label="Pause"><i>❚❚</i><span>Pause</span></button>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
